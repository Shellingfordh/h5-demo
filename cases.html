                                <div class="w-8 h-8 rounded-full bg-rose-600/30 text-rose-400 flex items-center justify-center mx-auto mb-2 font-bold">5</div>
                                <h3 class="text-xs font-bold text-white">实施壁垒与风险</h3>

                        </div>
                    </div>
                `;
            } else if (data.type === 'conclusion') {
                contentHTML = `
                    <div class="flex flex-col h-full justify-between items-center text-center p-4 md:p-8">
                        <div>
                            <span class="px-3 py-1 rounded-full bg-blue-500/20 border border-blue-400/30 text-blue-300 text-xs font-medium">
                                最终战略决策与提案
                            </span>
                            <h2 class="text-3xl md:text-4xl font-extrabold text-white mt-4">双轮驱动 · 极速 MVP 验证战略</h2>
                            <p class="text-slate-300 max-w-xl mx-auto mt-2 text-sm">
                                集中资源优先落地“跨境电商 AI 内容平台”与“AI 美颜/虚拟试穿工具”
                            </p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-6 w-full max-w-3xl text-left">
                            <div class="glass-card p-6 rounded-2xl border border-emerald-500/40">
                                <h3 class="text-lg font-bold text-emerald-400 mb-2 flex items-center">
                                    <i class="fa-solid fa-rocket mr-2"></i> 动作一：ToB 现金流突破
                                </h3>
                                <p class="text-xs text-slate-300 leading-relaxed">
                                    启动“跨境电商 AI 商品内容生成平台”6 周 MVP 研发，在跨境卖家社区获取 50-100 家种子客户，验证 SaaS 订阅与商品图/视频生成频次。
                                </p>
                            </div>
                            <div class="glass-card p-6 rounded-2xl border border-cyan-500/40">
                                <h3 class="text-lg font-bold text-cyan-400 mb-2 flex items-center">
                                    <i class="fa-solid fa-chart-line mr-2"></i> 动作二：ToC 流量变现
                                </h3>
                                <p class="text-xs text-slate-300 leading-relaxed">
                                    发布轻量“AI 美颜与虚拟试穿”轻应用，通过社交平台投放测试 CAC 与单次生成付费意愿，构建初始流量与快现金流。
                                </p>
                            </div>

                        <div class="bg-blue-950/60 border border-blue-500/30 p-4 rounded-xl max-w-2xl text-xs text-slate-200">

            }

            activeSlide.innerHTML = contentHTML;

            // Update Drawer Raw Text (Layer 2)
            const rawChapter = CHAPTER_RAW_DATA[data.chIndex] || CHAPTER_RAW_DATA[0];
            drawerContent.innerHTML = `
                <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 mb-4">
                    <h3 class="font-bold text-blue-400 text-base mb-2">${rawChapter.title}</h3>
                    <p class="text-xs text-slate-400 mb-3">（以下为基准文档原文全文，100% 完整保留，未作删除或缩减）</p>
                    <div class="whitespace-pre-wrap text-slate-200 leading-relaxed font-sans text-xs md:text-sm">
                        ${rawChapter.content}
                    </div>
                </div>
            `;
        }

        // TOC MODAL BUILDER
        function buildTocModal() {
            const tocCount = document.getElementById('tocCount'); if (tocCount) tocCount.textContent = `(14章 / ${SLIDES.length}页)`;
            tocList.innerHTML = CHAPTER_RAW_DATA.map((ch, idx) => `
                <div onclick="jumpToChapter(${idx})" class="p-4 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/60 cursor-pointer transition flex items-start space-x-3">
                    <span class="font-mono text-xs font-bold text-cyan-400 bg-slate-900 px-2 py-1 rounded shrink-0">
                        Ch ${ch.num}
                    </span>
                    <div>
                        <h4 class="text-sm font-bold text-slate-100">${ch.title}</h4>
                        <p class="text-xs text-slate-400 mt-1 line-clamp-2">${ch.content.substring(0, 80)}...</p>
                    </div>
                </div>
            `).join('');
        }

        // READER FULL CONTENT BUILDER
        function buildReaderContent() {
            readerBody.innerHTML = CHAPTER_RAW_DATA.map(ch => `
                <section class="border-b border-slate-800 pb-8">
                    <h2 class="text-xl font-bold text-cyan-400 mb-3 font-mono">${ch.title}</h2>
                    <div class="whitespace-pre-wrap text-slate-300 leading-relaxed font-sans text-sm md:text-base">
                        ${ch.content}
                    </div>
                </section>
            `).join('');
        }

        // NAVIGATION LOGIC
        function nextSlide() {
            if (currentIndex < SLIDES.length - 1) {
                currentIndex++;
                renderSlide(currentIndex);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide(currentIndex);
            }
        }

        function jumpToChapter(chIndex) {
            // Find first slide matching chapter index
            const targetIndex = SLIDES.findIndex(s => s.chIndex === chIndex);
            if (targetIndex !== -1) {
                currentIndex = targetIndex;
                renderSlide(currentIndex);
                tocModal.classList.add('hidden');
            }
        }

        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            if (drawerOpen) {
                detailDrawer.style.height = '280px';
                drawerToggleText.textContent = '收起原始未删减正文';
            } else {
                detailDrawer.style.height = '0px';
                drawerToggleText.textContent = '查看对应原始完整正文';
            }
        }

        function toggleToc() {
            tocModal.classList.toggle('hidden');
        }

        function toggleReader() {
            readerModal.classList.toggle('hidden');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // EVENT LISTENERS
        function setupEventListeners() {
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            toggleDrawerBtn.addEventListener('click', toggleDrawer);
            closeDrawerBtn.addEventListener('click', toggleDrawer);
            tocBtn.addEventListener('click', toggleToc);
            closeTocBtn.addEventListener('click', toggleToc);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            toggleReaderBtn.addEventListener('click', toggleReader);
            closeReaderBtn.addEventListener('click', toggleReader);

            // KEYBOARD SHORTCUTS
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevSlide();
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullscreen();
                } else if (e.key === 'Escape') {
                    tocModal.classList.add('hidden');
                    readerModal.classList.add('hidden');
                    if (drawerOpen) toggleDrawer();
                }
            });
        }

        // CONTENT PROTECTION & DISCLAIMER LOGIC
        function setupSecurityProtections() {
            // Disable context menu on slide view (allows inspect/copy disclaimer)
            document.addEventListener('contextmenu', (e) => {
                // If clicking inside selectable-text area, allow default
                if (e.target.closest('.selectable-text')) return;
                e.preventDefault();
            });

            // Prevent shortcuts like Ctrl+S, Ctrl+P, Ctrl+U on general areas
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
                    if (!e.target.closest('.selectable-text')) {
                        e.preventDefault();
                    }
                }
            });

            // Log technical limitation notice in developer console
            console.log("%c【防抓取与保护机制说明】", "color: #3b82f6; font-size: 14px; font-weight: bold;");
            console.log("客户端防选中与右键拦截旨在提高普通用户的直接复制成本。然而，无法完全防止通过浏览器开发者工具、网络请求分析或 OCR 提取公开交付的前端文本内容。真正的服务端保护需结合 JWT Token 与后端权限拦截。");
        }
    </script>
