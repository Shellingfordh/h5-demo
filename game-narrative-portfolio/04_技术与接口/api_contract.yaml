openapi: 3.0.0
info: {title: Golden Story API, version: 1.0.0}
paths:
  /v1/stories/{storyId}/progress:
    get: {summary: Get trusted story progress}
    put: {summary: Idempotent progress sync}
  /v1/stories/{storyId}/unlock:
    get: {summary: Evaluate chapter unlock rules}
  /v1/events:
    post: {summary: Submit normalized product event}
