<!doctype html><meta charset='utf-8'><title>Release Checklist</title><h1>发布检查表</h1><ul><li>内容版本号冻结；JSON Schema校验通过。</li><li>所有P0 QA通过，无Blocker/Critical。</li><li>Bridge版本兼容矩阵确认。</li><li>埋点在测试环境逐项验收。</li><li>分享卡真机验证。</li><li>音频版权/资源路径确认。</li><li>弱网/断网/恢复测试。</li><li>灰度开关、回滚版本、旧内容缓存策略确认。</li><li>客服FAQ与异常码准备。</li><li>上线后24h监控：进入率、崩溃、Bridge错误、章节完成、分享失败。</li></ul>
