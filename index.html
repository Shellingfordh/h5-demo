<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerContext Roadshow Presentation & Teleprompter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0B132B',
                            800: '#1C2541',
                            700: '#2A3A5E',
                            600: '#3A506B'
                        },
                        accent: {
                            cyan: '#00B4D8',
                            teal: '#48CAE4',
                            light: '#90E0EF'
                        },
                        warm: {
                            50: '#FAF9F6',
                            100: '#F8F9FA',
                            200: '#E9ECEF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B132B;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A3A5E;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00B4D8;
        }

        /* Pulse highlight for current slide in teleprompter */
        .active-tele-section {
            border-left: 4px solid #00B4D8;
            background-color: rgba(28, 37, 65, 0.4);
        }

        /* Cue badge highlights */
        .cue-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 4px;
            text-transform: uppercase;
        }
        .cue-speech { background-color: rgba(245, 158, 11, 0.2); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .cue-slide { background-color: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.4); }
        .cue-pause { background-color: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .cue-time { background-color: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.4); }

        /* Smooth animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-navy-900 text-warm-100 font-sans h-full flex flex-col overflow-hidden select-none">

    <!-- TOP CONTROL BAR -->
    <header class="bg-navy-800 border-b border-navy-700 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 z-50 shadow-md">
        <!-- Left: Branding & View Mode Toggle -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-accent-teal text-xl"></i>
                <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-accent-teal bg-clip-text text-transparent">PowerContext</span>
                <span class="text-xs bg-navy-700 text-accent-light px-2 py-0.5 rounded border border-navy-600 font-mono">Roadshow</span>
            </div>
            
            <div class="h-5 w-px bg-navy-600 hidden sm:block"></div>

            <!-- Mode Switcher -->
            <div class="flex bg-navy-900 rounded-lg p-1 border border-navy-700">
                <button id="btn-mode-slides" onclick="switchView('slides')" class="px-3 py-1 text-xs font-medium rounded-md transition-all bg-accent-cyan text-navy-900 font-semibold shadow">
                    <i class="fa-solid fa-desktop mr-1.5"></i>Slide View
                </button>
                <button id="btn-mode-tele" onclick="switchView('teleprompter')" class="px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-scroll mr-1.5"></i>Teleprompter
                </button>
            </div>

            <!-- New: Toggle Side Notes / Teleprompter Panel -->
            <button id="btn-toggle-notes" onclick="toggleSideNotes()" class="bg-navy-700 hover:bg-navy-600 text-accent-light text-xs px-2.5 py-1.5 rounded-lg border border-navy-600 transition flex items-center space-x-1.5" title="Show/Hide Teleprompter Script Panel">
                <i class="fa-solid fa-columns"></i>
                <span id="notes-toggle-text">隐藏提词</span>
            </button>
        </div>

        <!-- Center: Slide Navigation Quick Access -->
        <div class="flex items-center space-x-2">
            <button onclick="prevSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Previous Slide (Left Arrow)">
                <i class="fa-solid fa-chevron-left w-4 h-4 flex items-center justify-center"></i>
            </button>
            <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="bg-navy-900 text-accent-teal text-xs font-medium rounded-lg px-2.5 py-1.5 border border-navy-700 focus:outline-none focus:border-accent-cyan cursor-pointer">
                <!-- Populated via JS -->
            </select>
            <button onclick="nextSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Next Slide (Right Arrow)">
                <i class="fa-solid fa-chevron-right w-4 h-4 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Right: Teleprompter Controls & Timer -->
        <div class="flex items-center space-x-3">
            <!-- Timer & Stopwatch -->
            <div class="flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-3 py-1 font-mono text-xs">
                <i class="fa-regular fa-clock text-accent-teal"></i>
                <span id="timer-display" class="text-white font-medium">00:00</span>
                <button id="btn-timer-toggle" onclick="toggleTimer()" class="text-gray-400 hover:text-accent-teal ml-1">
                    <i class="fa-solid fa-play" id="timer-icon"></i>
                </button>
                <button onclick="resetTimer()" class="text-gray-400 hover:text-red-400 ml-0.5">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Font Size Control -->
            <div class="hidden md:flex items-center space-x-1 bg-navy-900 border border-navy-700 rounded-lg p-1">
                <button onclick="adjustFontSize(-1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Decrease Font Size">A-</button>
                <span id="font-size-label" class="text-xs text-accent-teal font-mono px-1">16px</span>
                <button onclick="adjustFontSize(1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Increase Font Size">A+</button>
            </div>

            <!-- Auto-Scroll Speed (Teleprompter Mode) -->
            <div id="tele-controls" class="hidden flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-2 py-1">
                <button id="btn-tele-play" onclick="toggleTeleprompterScroll()" class="text-accent-cyan hover:text-accent-teal p-1">
                    <i class="fa-solid fa-play" id="tele-play-icon"></i>
                </button>
                <span class="text-xs text-gray-400 font-mono">Speed:</span>
                <input type="range" id="scroll-speed" min="1" max="10" value="3" onchange="updateScrollSpeed(this.value)" class="w-16 accent-accent-cyan cursor-pointer">
                <span id="speed-label" class="text-xs font-mono text-accent-teal">3x</span>
            </div>

            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullscreen()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-gray-300 hover:text-white transition" title="Toggle Fullscreen">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 relative overflow-hidden flex">

        <!-- VIEW 1: DUAL SLIDE & NOTES PRESENTATION VIEW -->
        <div id="view-slides" class="w-full h-full flex flex-col lg:flex-row overflow-hidden">
            <!-- Left Side: Projected Slide Deck Canvas (Expands to full width when notes are hidden) -->
            <div id="slide-canvas-container" class="w-full lg:w-7/12 h-full bg-navy-900 p-4 lg:p-8 flex flex-col justify-between transition-all duration-300 relative overflow-y-auto border-r border-navy-700">
                <!-- Slide Header info -->
                <div class="flex justify-between items-center mb-4">
                    <span id="slide-num-badge" class="text-xs font-mono px-2.5 py-1 rounded bg-navy-800 text-accent-teal border border-navy-700">SLIDE 01 / 12</span>
                    <span id="slide-timing-badge" class="text-xs font-mono text-gray-400"><i class="fa-regular fa-clock mr-1"></i>45s</span>
                </div>

                <!-- Slide Center Content -->
                <div id="slide-content-area" class="my-auto fade-in">
                    <!-- Dynamic Slide HTML inserted here -->
                </div>

                <!-- Slide Footer Info -->
                <div class="mt-6 pt-4 border-t border-navy-800 flex justify-between items-center text-xs text-gray-500 font-mono">
                    <span>OceanBase AI Agent Context Infrastructure</span>
                    <span>PowerContext Roadshow</span>
                </div>
            </div>

            <!-- Right Side: Verbatim Script, Speaker Cues & Notes (Toggleable) -->
            <div id="speaker-notes-container" class="w-full lg:w-5/12 h-full bg-navy-800/90 flex flex-col overflow-hidden transition-all duration-300">
                <div class="p-3 bg-navy-800 border-b border-navy-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comment-dots text-accent-cyan"></i>
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-300">Speaker Script & Cues (中英双语逐字稿)</span>
                    </div>
                    <div class="flex space-x-1 text-xs">
                        <button onclick="toggleLanguageFilter('all')" id="lang-btn-all" class="px-2 py-0.5 rounded bg-accent-cyan text-navy-900 font-semibold">ALL</button>
                        <button onclick="toggleLanguageFilter('zh')" id="lang-btn-zh" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">中文</button>
                        <button onclick="toggleLanguageFilter('en')" id="lang-btn-en" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">EN</button>
                    </div>
                </div>

                <div id="speaker-notes-area" class="flex-1 p-6 overflow-y-auto space-y-4 text-warm-100 leading-relaxed font-sans text-sm">
                    <!-- Dynamic Speaker Notes inserted here -->
                </div>
            </div>
        </div>

        <!-- VIEW 2: CONTINUOUS TELEPROMPTER VIEW -->
        <div id="view-teleprompter" class="w-full h-full hidden overflow-y-auto px-4 md:px-24 py-12 space-y-16 scroll-smooth bg-navy-900">
            <div class="max-w-4xl mx-auto space-y-16 pb-64" id="teleprompter-content">
                <!-- Dynamically generated continuous text for all slides -->
            </div>
        </div>

    </main>

    <!-- BOTTOM KEYBOARD NAVIGATION HINT BAR -->
    <footer class="bg-navy-900 border-t border-navy-800 px-4 py-1.5 text-xs text-gray-400 flex justify-between items-center z-40">
        <div class="flex items-center space-x-4">
            <span><kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">←</kbd> <kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">→</kbd> 切换幻灯片</span>
            <span><kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">Space</kbd> 自动滚动/计时</span>
        </div>
        <div class="hidden sm:block text-gray-500">
            按 <kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-gray-400">F</kbd> 全屏显示 | 点击左上角「隐藏提词」可全屏展示 PPT
        </div>
    </footer>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- SLIDE DATA STRUCTURE (ALL 12 SECTIONS COMPREHENSIVELY PRESERVED) ---
        const slidesData = [
            {
                id: 1,
                titleCH: "当工作结束，经验去了哪里？",
                titleEN: "When the Work Ends, Where Does the Knowledge Go?",
                subtitleCH: "工作会结束，知识不应该随之消失。",
                subtitleEN: "Work may end, but knowledge should not disappear with it.",
                timing: "45 秒",
                type: "opening",
                bullets: [
                    { ch: "村庄故事：老木匠的材料经验、修桥者的未竟问题无法有效继承", en: "Village Story: Experienced carpenter's material wisdom and bridge repair logs lost without proper inheritance" },
                    { ch: "人员流动与接手者：后续接手者只能被迫从零开始探索", en: "Personnel turnover: Successors forced to restart from scratch repeatedly" },
                    { ch: "AI Agent 的平行挑战：单次对话聪明，但缺乏跨会话的工作连续性", en: "AI Agent Parallel: Single session intelligence vs. lack of cross-session work continuity" }
                ],
                cues: [
                    { type: "speech", text: "开场先看向听众，停顿两秒。语速放慢，不要一上来就讲技术名词。" }
                ],
                script: [
                    { zh: "大家好，今天我想从一个很简单的问题开始。当一项工作结束之后，我们究竟留下了什么？", en: "Hello everyone. Today, I would like to start with a simple question. When a piece of work ends, what do we actually leave behind?" },
                    { zh: "想象一个村庄。村里的老木匠知道哪种木料容易开裂，负责修桥的人知道上次维修留下了什么问题。这些知识来自长期实践，对整个村庄都很重要。", en: "Imagine a village. The experienced carpenter knows which types of wood are likely to crack. The person responsible for repairing the bridge knows what problems were left unresolved last time. This knowledge comes from years of practice, and it matters to the entire community." },
                    { zh: "但如果他们离开了，下一位接手者可能只能从头开始。", en: "But when they leave, the next person may have to start from scratch." },
                    { zh: "这让我想到 AI Agent 面临的一个相似问题。一次对话可以很聪明，但如果重要的决定和工作进度没有被保留下来，下一次工作就可能失去连续性。", en: "This brings me to a similar challenge in AI agents. A single conversation can be intelligent, but without preserving important decisions and progress, the next session may lose continuity." }
                ],
                nextCue: "停顿半秒，切到村庄的问题清单。"
            },
            {
                id: 2,
                titleCH: "信息断层的代价",
                titleEN: "The Cost of Lost Context",
                timing: "45 秒",
                type: "grid",
                gridItems: [
                    { icon: "fa-brain", titleCH: "决策丢失", titleEN: "Lost decisions", descCH: "遗忘先前的约束与定论", descEN: "Forgetting prior bounds & findings" },
                    { icon: "fa-rotate-right", titleCH: "重复劳动", titleEN: "Repeated work", descCH: "重复排除已解决的问题", descEN: "Re-checking resolved issues" },
                    { icon: "fa-link-slash", titleCH: "交接断层", titleEN: "Broken handoffs", descCH: "每次交接需重讲背景", descEN: "Re-explaining full context each time" },
                    { icon: "fa-triangle-exclamation", titleCH: "错误重现", titleEN: "Repeated mistakes", descCH: "踩中已知且犯过的坑", descEN: "Falling into previously known traps" }
                ],
                cues: [
                    { type: "speech", text: "用村庄案例继续推进。不要逐条机械念屏幕上的文字。" }
                ],
                script: [
                    { zh: "村庄真正的问题，并不只是某个人忘记了一件事。更大的问题在于，整个团队无法稳定地继承已经积累的知识。", en: "The real problem in the village is not simply that one person forgets something. The bigger issue is that the community cannot reliably inherit the knowledge it has already accumulated." },
                    { zh: "比如，维修人员可能重复检查已经排除的问题，新来的木匠可能再次使用不合适的材料，而每一次交接都需要重新解释背景。", en: "For example, a repair worker may repeat checks that have already been completed, a new carpenter may use unsuitable materials again, and every handoff may require the background to be explained all over again." },
                    { zh: "这些损失会随着协作次数增加而累积。在软件开发中，我们也会遇到类似情况，尤其是项目持续数周甚至数月、任务在不同人员或不同 AI Agent 之间流转的时候。", en: "These losses accumulate as collaboration continues. We encounter the same pattern in software development, especially when projects last for weeks or months and tasks move between different people or AI agents." },
                    { zh: "所以，问题的关键是怎样让重要信息在工作过程中被保存，在需要的时候能够被找到，并且在交接时仍然可信。", en: "The key question is how to preserve important information during work, retrieve it when needed, and keep it trustworthy when responsibility changes hands." }
                ]
            },
            {
                id: 3,

                titleEN: "Why Do AI Agents Lose Context?",
                timing: "50 秒",
                type: "comparison",
                quoteCH: "对话记录不等于可用的工作上下文。",
                quoteEN: "A conversation transcript is not the same as usable work context.",
                bullets: [
                    { ch: "会话边界 (Session Boundary)：单次会话结束后背景上下文即重置", en: "Session Boundaries: Context resets completely upon conversation completion" },
                    { ch: "上下文窗口限制 (Context Window Limit)：全量历史成本高且容易引发噪声干扰", en: "Context Window Limits: Re-feeding raw transcript is noisy, costly, and ineffective" },
                    { ch: "信息过载与筛选困难：原始对话混杂了过时的中间思考与临时废稿", en: "Information Overload: Raw history contains obsolete temporary thoughts and noise" }
                ],
                cues: [
                    { type: "speech", text: "这一页从生活案例转入技术。强调“信息保存”和“信息使用”之间的区别。" }
                ],
                script: [
                    { zh: "AI Agent 的工作方式让这个问题更加明显。Agent 可以在一次会话里理解需求、分析代码、作出决定并执行任务，但会话结束之后，下一次会话未必能够直接获得所有必要的背景。", en: "This challenge becomes more visible with AI agents. An agent can understand requirements, analyze code, make decisions, and execute tasks within one session. After the session ends, however, the next session may not have all the context it needs." },
                    { zh: "即使历史记录还在，直接把整段历史重新交给模型也未必是最好的方案。历史可能很长，其中有些信息已经过时，有些与当前任务无关，还有些只是当时的临时讨论。", en: "Even when the transcript still exists, sending the entire history back to the model is not necessarily the best solution. The history may be long, some information may be outdated, some may be irrelevant, and some may reflect only temporary discussion." },

                titleEN: "What Is PowerContext?",
                timing: "50 秒",
                type: "architecture",
                subtitleCH: "OceanBase 开源的 AI Agent 上下文基础设施",
                subtitleEN: "Open-source context infrastructure for AI agents",
                archSteps: [
                    { step: "Input", ch: "AI Agent / 人类协作", en: "Work in progress" },
                    { step: "Core", ch: "PowerContext 服务", desc: "Capture · Organize · Retrieve · Hand off\n记录 · 组织 · 检索 · 交接", highlight: true },
                    { step: "Output", ch: "后续会话 / Agent / 团队成员", en: "Next session / Agent / Teammate" }
                ],
                cues: [
                    { type: "speech", text: "可以指向架构图，说明 PowerContext 位于 Agent 的工作过程与持久化上下文之间。" }
                ],
                script: [
                    { zh: "PowerContext 是 OceanBase 开源的 AI Agent 上下文服务。它的目标是让有价值的工作上下文脱离单一对话，能够在不同会话、不同 Agent 和人与 Agent 的交接中继续发挥作用。", en: "PowerContext is an open-source context service for AI agents developed under OceanBase. Its goal is to keep valuable work context outside any single conversation, so it can remain useful across sessions, agents, and handoffs between people and agents." },
                    { zh: "它保存的不只是传统意义上的记忆，还包括工作中的决策、约束、证据、进度，以及经过整理、可以再次使用的经验。", en: "It preserves more than memory in the traditional sense. It also organizes decisions, constraints, evidence, progress, and experience that can be reused in future work." },
                    { zh: "从产品角度看，它试图解决的是工作连续性。从工程角度看，它提供了可追溯、可管理的上下文资产，以及供不同 Agent 和应用使用的接口。", en: "From a product perspective, it addresses work continuity. From an engineering perspective, it provides traceable, manageable context artifacts and interfaces that different agents and applications can use." },

                    { title: "Skill", sub: "可复用的程序", ch: "把经过审查的操作步骤和验证要求整理成技能。", en: "Reviewed procedures and validation checks." }
                ],
                cues: [
                    { type: "speech", text: "按四个模块依次讲解。每个概念只解释它解决的问题，不要深入 API 细节。" }

                    </div>
            `;

            if (slide.type === 'opening') {
                html += `
                    <div class="bg-navy-800/60 border border-navy-700 rounded-xl p-6 my-4">
                        <p class="text-lg font-medium text-warm-50">${slide.subtitleCH}</p>
                        <p class="text-sm text-gray-400 font-mono mt-1">${slide.subtitleEN}</p>
                    </div>
                    <div class="space-y-3 mt-4">
                        ${slide.bullets.map(b => `
                            <div class="flex items-start space-x-3 bg-navy-800/40 p-3 rounded-lg border border-navy-700/50">
                                <i class="fa-solid fa-circle-dot text-accent-cyan mt-1.5 text-xs"></i>
                                <div>
                                    <p class="text-sm font-medium text-gray-200">${b.ch}</p>
                                    <p class="text-xs text-gray-400 font-mono">${b.en}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'grid') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        ${slide.gridItems.map(item => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4 flex items-start space-x-4">
                                <div class="w-10 h-10 rounded-lg bg-navy-700 flex items-center justify-center text-accent-cyan shrink-0">
                                    <i class="fa-solid ${item.icon} text-lg"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-base">${item.titleCH}</h4>
                                    <p class="text-xs text-accent-light font-mono">${item.titleEN}</p>
                                    <p class="text-xs text-gray-300 mt-1.5">${item.descCH}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'comparison') {
                html += `
                    <div class="bg-navy-800/80 border border-accent-cyan/30 rounded-xl p-5 my-4">
                        <p class="text-accent-light font-medium italic text-base">“${slide.quoteCH}”</p>
                        <p class="text-xs text-gray-400 font-mono mt-1">${slide.quoteEN}</p>
                    </div>
                    <div class="space-y-3">
                        ${slide.bullets.map(b => `
                            <div class="flex items-start space-x-3 bg-navy-800/40 p-3 rounded-lg border border-navy-700">
                                <i class="fa-solid fa-arrow-right text-accent-teal mt-1 text-xs"></i>
                                <div>
                                    <p class="text-sm text-gray-200 font-medium">${b.ch}</p>
                                    <p class="text-xs text-gray-400 font-mono">${b.en}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'architecture') {
                html += `
                    <div class="bg-navy-800/60 border border-navy-700 rounded-xl p-5 my-4">
                        <p class="text-lg font-semibold text-white">${slide.subtitleCH}</p>
                        <p class="text-xs text-accent-teal font-mono mt-0.5">${slide.subtitleEN}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4">
                        ${slide.archSteps.map(st => `
                            <div class="rounded-xl p-4 border text-center flex flex-col justify-center ${st.highlight ? 'bg-navy-700/80 border-accent-cyan shadow-lg shadow-accent-cyan/10' : 'bg-navy-800/50 border-navy-700'}">
                                <span class="text-xs font-mono text-accent-light uppercase">${st.step}</span>
                                <p class="font-bold text-white text-sm mt-1">${st.ch}</p>
                                <p class="text-xs text-gray-400 font-mono mt-0.5 whitespace-pre-line">${st.en || st.desc || ''}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'four-cards') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        ${slide.cards.map(c => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4 hover:border-accent-cyan/50 transition">
                                <div class="flex justify-between items-start">
                                    <span class="font-mono font-bold text-accent-cyan text-lg">${c.title}</span>
                                    <span class="text-xs bg-navy-700 text-accent-light px-2 py-0.5 rounded font-mono">${c.sub}</span>
                                </div>
                                <p class="text-sm text-gray-200 mt-2 font-medium">${c.ch}</p>
                                <p class="text-xs text-gray-400 font-mono mt-1">${c.en}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'flow') {
                html += `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 my-4">
                        ${slide.flowSteps.map(f => `
                            <div class="bg-navy-800/70 border border-navy-700 rounded-lg p-3 text-center">
                                <span class="text-xs font-mono font-bold text-accent-cyan px-2 py-0.5 bg-navy-900 rounded">${f.num}</span>
                                <h4 class="font-bold text-white text-sm mt-2">${f.name}</h4>
                                <p class="text-xs text-gray-300 mt-1">${f.descCH}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="space-y-2 mt-2">
                        ${slide.bullets.map(b => `
                            <div class="flex items-center space-x-2 text-xs bg-navy-800/40 p-2.5 rounded border border-navy-700/50">
                                <i class="fa-solid fa-check text-accent-teal"></i>
                                <span class="text-gray-200">${b.ch}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'engineering') {
                html += `
                    <div class="space-y-3 mt-4">
                        ${slide.focusPoints.map(fp => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4">
                                <div class="flex items-center space-x-2">
                                    <i class="fa-solid fa-code text-accent-cyan text-sm"></i>
                                    <h4 class="font-bold text-white text-sm">${fp.title}</h4>
                                </div>
                                <p class="text-xs text-gray-200 mt-1.5 pl-5">${fp.detailCH}</p>
                                <p class="text-xs text-accent-light/80 font-mono mt-0.5 pl-5">${fp.detailEN}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'values') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 my-4">
                        ${slide.values.map(v => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4 text-center">
                                <h4 class="font-bold text-accent-teal text-base">${v.labelCH}</h4>
                                <p class="text-xs text-gray-400 font-mono">${v.labelEN}</p>
                                <p class="text-xs text-gray-200 mt-2">${v.descCH}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-navy-800/60 border border-amber-500/30 rounded-xl p-3.5 mt-2">
                        <p class="text-xs text-amber-300 font-medium">${slide.quoteCH}</p>
                        <p class="text-xs text-gray-400 font-mono mt-0.5">${slide.quoteEN}</p>
                    </div>
                `;
            } else if (slide.type === 'conclusion') {
                html += `
                    <div class="bg-navy-800/80 border border-accent-cyan/40 rounded-xl p-6 text-center my-6 shadow-lg">
                        <h3 class="text-xl font-bold text-white">${slide.quoteCH}</h3>
                        <p class="text-sm text-accent-teal font-mono mt-1">${slide.quoteEN}</p>
                        <p class="text-sm text-gray-300 mt-4 font-medium">${slide.subtitleCH}</p>
                        <p class="text-xs text-gray-400 font-mono mt-1">${slide.subtitleEN}</p>
                    </div>
                `;
            } else if (slide.type === 'backup') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4">
                        ${slide.backupSections.map(bs => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4">
                                <h4 class="font-bold text-accent-teal text-sm mb-2">${bs.title}</h4>
                                <ul class="space-y-1.5">
                                    ${bs.items.map(it => `<li class="text-xs text-gray-300 flex items-center space-x-1.5"><i class="fa-solid fa-angle-right text-accent-cyan"></i><span>${it}</span></li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (slide.type === 'qa') {
                html += `
                    <div class="space-y-4 mt-4">
                        ${slide.qaList.map(qa => `
                            <div class="bg-navy-800/80 border border-navy-700 rounded-xl p-4">
                                <h4 class="font-bold text-accent-cyan text-sm">${qa.q}</h4>
                                <p class="text-xs text-gray-200 mt-2">${qa.ch}</p>
                                <p class="text-xs text-gray-400 font-mono mt-1">${qa.en}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            html += `</div>`;
            area.innerHTML = html;

            // Render Speaker Notes Area
            renderSpeakerNotes(slide);
        }

        // Render Speaker Notes with Cues & Language Filter
        function renderSpeakerNotes(slide) {
            const notesArea = document.getElementById('speaker-notes-area');
            let notesHtml = '';

            // Render Cues if available
            if (slide.cues && slide.cues.length > 0) {
                notesHtml += `<div class="space-y-1.5 mb-3">`;
                slide.cues.forEach(cue => {
                    let badgeClass = cue.type === 'speech' ? 'cue-speech' : (cue.type === 'slide' ? 'cue-slide' : 'cue-pause');
                    notesHtml += `<div><span class="cue-tag ${badgeClass}">演讲提示</span><span class="text-xs text-amber-200 italic">${cue.text}</span></div>`;
                });
                notesHtml += `</div><hr class="border-navy-700 my-2">`;
            }

            // Render Script Paragraphs
            if (slide.script) {
                slide.script.forEach(s => {
                    notesHtml += `<div class="space-y-1.5 bg-navy-900/50 p-3 rounded-lg border border-navy-700/50">`;
                    if (currentLangFilter === 'all' || currentLangFilter === 'zh') {
                        notesHtml += `<p class="text-warm-50 text-sm leading-relaxed">${s.zh}</p>`;
                    }
                    if (currentLangFilter === 'all' || currentLangFilter === 'en') {
                        notesHtml += `<p class="text-accent-light text-xs font-mono leading-relaxed">${s.en}</p>`;
                    }
                    notesHtml += `</div>`;
                });
            }

            // Render Next Cue if available
            if (slide.nextCue) {
                notesHtml += `<div class="mt-3 pt-2 border-t border-navy-700"><span class="cue-tag cue-pause">翻页提示</span><span class="text-xs text-red-300 italic">${slide.nextCue}</span></div>`;
            }

            notesArea.innerHTML = notesHtml;
        }

        // Toggle Language Filter (ALL / ZH / EN)
        function toggleLanguageFilter(lang) {
            currentLangFilter = lang;
            ['all', 'zh', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-btn-${l}`);
                if (l === lang) {
                    btn.className = "px-2 py-0.5 rounded bg-accent-cyan text-navy-900 font-semibold";
                } else {
                    btn.className = "px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white";
                }
            });
            renderSpeakerNotes(slidesData[currentSlideIndex]);
        }

        // Build Full Continuous Teleprompter View
        function buildTeleprompterView() {
            const container = document.getElementById('teleprompter-content');
            let html = '';

            slidesData.forEach((slide, idx) => {
                html += `
                    <div id="tele-slide-${idx}" class="tele-section bg-navy-800/60 border border-navy-700 rounded-2xl p-6 md:p-10 space-y-6 transition-all">
                        <div class="flex justify-between items-center border-b border-navy-700 pb-4">
                            <span class="text-xs font-mono px-3 py-1 rounded bg-navy-700 text-accent-teal font-bold">SLIDE ${slide.id < 10 ? '0' + slide.id : slide.id} / ${slidesData.length}</span>
                            <span class="text-sm font-bold text-white">${slide.titleCH} / <span class="text-accent-teal font-mono text-xs">${slide.titleEN}</span></span>
                        </div>
                `;

                if (slide.cues && slide.cues.length > 0) {
                    html += `<div class="space-y-1">`;
                    slide.cues.forEach(c => {
                        html += `<div><span class="cue-tag cue-speech">提示</span><span class="text-xs text-amber-200 italic">${c.text}</span></div>`;
                    });
                    html += `</div>`;
                }

                if (slide.script) {
                    html += `<div class="space-y-4">`;
                    slide.script.forEach(s => {
                        html += `
                            <div class="bg-navy-900/80 p-4 rounded-xl border border-navy-700 space-y-2">
                                <p class="text-base text-warm-50 leading-relaxed font-sans">${s.zh}</p>
                                <p class="text-xs text-accent-light font-mono leading-relaxed">${s.en}</p>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                if (slide.nextCue) {
                    html += `<div><span class="cue-tag cue-pause">动作</span><span class="text-xs text-red-300 italic">${slide.nextCue}</span></div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // Highlight Active Slide in Teleprompter Mode
        function highlightActiveTeleSection() {
            document.querySelectorAll('.tele-section').forEach((sec, idx) => {
                if (idx === currentSlideIndex) {
                    sec.classList.add('active-tele-section');
                    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    sec.classList.remove('active-tele-section');
                }
            });
        }

        // Timer Stopwatch Functions
        function toggleTimer() {
            const icon = document.getElementById('timer-icon');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                icon.className = "fa-solid fa-play";
            } else {
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
                isTimerRunning = true;
                icon.className = "fa-solid fa-pause";
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            secondsElapsed = 0;
            updateTimerDisplay();
            document.getElementById('timer-icon').className = "fa-solid fa-play";
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            document.getElementById('timer-display').textContent = `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
        }

        // Teleprompter Auto-Scroll Functions
        function toggleTeleprompterScroll() {
            const teleView = document.getElementById('view-teleprompter');
            const icon = document.getElementById('tele-play-icon');
            if (isTeleScrolling) {
                clearInterval(teleScrollInterval);
                isTeleScrolling = false;
                icon.className = "fa-solid fa-play";
            } else {
                teleScrollInterval = setInterval(() => {
                    teleView.scrollBy({ top: scrollSpeedMultiplier * 1.5, behavior: 'smooth' });
                }, 50);
                isTeleScrolling = true;
                icon.className = "fa-solid fa-pause";
            }
        }

        function updateScrollSpeed(val) {
            scrollSpeedMultiplier = parseInt(val);
            document.getElementById('speed-label').textContent = `${val}x`;
            if (isTeleScrolling) {
                clearInterval(teleScrollInterval);
                const teleView = document.getElementById('view-teleprompter');
                teleScrollInterval = setInterval(() => {
                    teleView.scrollBy({ top: scrollSpeedMultiplier * 1.5, behavior: 'smooth' });
                }, 50);
            }
        }

        function stopTeleprompterScroll() {
            if (isTeleScrolling) {
                clearInterval(teleScrollInterval);
                isTeleScrolling = false;
                document.getElementById('tele-play-icon').className = "fa-solid fa-play";
            }
        }

        // Font Size Adjuster
        function adjustFontSize(delta) {
            currentFontSize = Math.min(24, Math.max(12, currentFontSize + delta));
            document.getElementById('font-size-label').textContent = `${currentFontSize}px`;
            document.getElementById('speaker-notes-area').style.fontSize = `${currentFontSize}px`;
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard Navigation
        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevSlide();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (currentView === 'teleprompter') {
                        toggleTeleprompterScroll();
                    } else {
                        toggleTimer();
                    }
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullscreen();
                }
            });
        }
    </script>
</body>
</html>
