<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerContext Roadshow Presentation & Teleprompter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0B132B',
                            800: '#1C2541',
                            700: '#2A3A5E',
                            600: '#3A506B'
                        },
                        accent: {
                            cyan: '#00B4D8',
                            teal: '#48CAE4',
                            light: '#90E0EF'
                        },
                        warm: {
                            50: '#FAF9F6',
                            100: '#F8F9FA',
                            200: '#E9ECEF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B132B;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A3A5E;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00B4D8;
        }

        /* Pulse highlight for current slide in teleprompter */
        .active-tele-section {
            border-left: 4px solid #00B4D8;
            background-color: rgba(28, 37, 65, 0.4);
        }

        /* Cue badge highlights */
        .cue-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 4px;
            text-transform: uppercase;
        }
        .cue-speech { background-color: rgba(245, 158, 11, 0.2); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .cue-slide { background-color: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.4); }
        .cue-pause { background-color: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .cue-time { background-color: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.4); }

        /* Smooth animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-navy-900 text-warm-100 font-sans h-full flex flex-col overflow-hidden select-none">

    <!-- TOP CONTROL BAR -->
    <header class="bg-navy-800 border-b border-navy-700 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 z-50 shadow-md">
        <!-- Left: Branding & View Mode Toggle -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-accent-teal text-xl"></i>
                <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-accent-teal bg-clip-text text-transparent">PowerContext</span>
                <span class="text-xs bg-navy-700 text-accent-light px-2 py-0.5 rounded border border-navy-600 font-mono">Roadshow</span>
            </div>
            
            <div class="h-5 w-px bg-navy-600 hidden sm:block"></div>

            <!-- Mode Switcher -->
            <div class="flex bg-navy-900 rounded-lg p-1 border border-navy-700">
                <button id="btn-mode-slides" onclick="switchView('slides')" class="px-3 py-1 text-xs font-medium rounded-md transition-all bg-accent-cyan text-navy-900 font-semibold shadow">
                    <i class="fa-solid fa-desktop mr-1.5"></i>Slide View
                </button>
                <button id="btn-mode-tele" onclick="switchView('teleprompter')" class="px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-scroll mr-1.5"></i>Teleprompter
                </button>
            </div>
        </div>

        <!-- Center: Slide Navigation Quick Access -->
        <div class="flex items-center space-x-2">
            <button onclick="prevSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Previous Slide (Left Arrow)">
                <i class="fa-solid fa-chevron-left w-4 h-4 flex items-center justify-center"></i>
            </button>
            <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="bg-navy-900 text-accent-teal text-xs font-medium rounded-lg px-2.5 py-1.5 border border-navy-700 focus:outline-none focus:border-accent-cyan cursor-pointer">
                <!-- Populated via JS -->
            </select>
            <button onclick="nextSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Next Slide (Right Arrow)">
                <i class="fa-solid fa-chevron-right w-4 h-4 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Right: Teleprompter Controls & Timer -->
        <div class="flex items-center space-x-3">
            <!-- Timer & Stopwatch -->
            <div class="flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-3 py-1 font-mono text-xs">
                <i class="fa-regular fa-clock text-accent-teal"></i>
                <span id="timer-display" class="text-white font-medium">00:00</span>
                <button id="btn-timer-toggle" onclick="toggleTimer()" class="text-gray-400 hover:text-accent-teal ml-1">
                    <i class="fa-solid fa-play" id="timer-icon"></i>
                </button>
                <button onclick="resetTimer()" class="text-gray-400 hover:text-red-400 ml-0.5">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Font Size Control -->
            <div class="hidden md:flex items-center space-x-1 bg-navy-900 border border-navy-700 rounded-lg p-1">
                <button onclick="adjustFontSize(-1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Decrease Font Size">A-</button>
                <span id="font-size-label" class="text-xs text-accent-teal font-mono px-1">16px</span>
                <button onclick="adjustFontSize(1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Increase Font Size">A+</button>
            </div>

            <!-- Auto-Scroll Speed (Teleprompter Mode) -->
            <div id="tele-controls" class="hidden flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-2 py-1">
                <button id="btn-tele-play" onclick="toggleTeleprompterScroll()" class="text-accent-cyan hover:text-accent-teal p-1">
                    <i class="fa-solid fa-play" id="tele-play-icon"></i>
                </button>
                <span class="text-xs text-gray-400 font-mono">Speed:</span>
                <input type="range" id="scroll-speed" min="1" max="10" value="3" onchange="updateScrollSpeed(this.value)" class="w-16 accent-accent-cyan cursor-pointer">
                <span id="speed-label" class="text-xs font-mono text-accent-teal">3x</span>
            </div>

            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullscreen()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-gray-300 hover:text-white transition" title="Toggle Fullscreen">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 relative overflow-hidden flex">

        <!-- VIEW 1: DUAL SLIDE & NOTES PRESENTATION VIEW -->
        <div id="view-slides" class="w-full h-full flex flex-col lg:flex-row overflow-hidden">
            <!-- Left Side: Projected Slide Deck Canvas (2/3 width on large screens) -->
            <div class="lg:w-7/12 h-1/2 lg:h-full bg-navy-900 p-4 lg:p-8 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-navy-700 relative overflow-y-auto">
                <!-- Slide Header info -->
                <div class="flex justify-between items-center mb-4">
                    <span id="slide-num-badge" class="text-xs font-mono px-2.5 py-1 rounded bg-navy-800 text-accent-teal border border-navy-700">SLIDE 01 / 12</span>
                    <span id="slide-timing-badge" class="text-xs font-mono text-gray-400"><i class="fa-regular fa-clock mr-1"></i>45s</span>
                </div>

                <!-- Slide Center Content -->
                <div id="slide-content-area" class="my-auto fade-in">
                    <!-- Dynamic Slide HTML inserted here -->
                </div>

                <!-- Slide Footer Info -->
                <div class="mt-6 pt-4 border-t border-navy-800 flex justify-between items-center text-xs text-gray-500 font-mono">
                    <span>OceanBase AI Agent Context Infrastructure</span>
                    <span>PowerContext Roadshow</span>
                </div>
            </div>

            <!-- Right Side: Verbatim Script, Speaker Cues & Notes (1/3 width) -->
            <div class="lg:w-5/12 h-1/2 lg:h-full bg-navy-800/90 flex flex-col overflow-hidden">
                <div class="p-3 bg-navy-800 border-b border-navy-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comment-dots text-accent-cyan"></i>
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-300">Speaker Script & Cues (中英双语逐字稿)</span>
                    </div>
                    <div class="flex space-x-1 text-xs">
                        <button onclick="toggleLanguageFilter('all')" id="lang-btn-all" class="px-2 py-0.5 rounded bg-accent-cyan text-navy-900 font-semibold">ALL</button>
                        <button onclick="toggleLanguageFilter('zh')" id="lang-btn-zh" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">中文</button>
                        <button onclick="toggleLanguageFilter('en')" id="lang-btn-en" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">EN</button>
                    </div>
                </div>

                <div id="speaker-notes-area" class="flex-1 p-6 overflow-y-auto space-y-4 text-warm-100 leading-relaxed font-sans text-sm">
                    <!-- Dynamic Speaker Notes inserted here -->
                </div>
            </div>
        </div>

        <!-- VIEW 2: CONTINUOUS TELEPROMPTER VIEW -->
        <div id="view-teleprompter" class="w-full h-full hidden overflow-y-auto px-4 md:px-24 py-12 space-y-16 scroll-smooth bg-navy-900">
            <div class="max-w-4xl mx-auto space-y-16 pb-64" id="teleprompter-content">
                <!-- Dynamically generated continuous text for all slides -->
            </div>
        </div>

    </main>

    <!-- BOTTOM KEYBOARD NAVIGATION HINT BAR -->
    <footer class="bg-navy-900 border-t border-navy-800 px-4 py-1.5 text-xs text-gray-400 flex justify-between items-center z-40">
        <div class="flex items-center space-x-4">
            <span><kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">←</kbd> <kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">→</kbd> Navigate Slides</span>
            <span><kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-accent-teal">Space</kbd> Play/Pause Teleprompter</span>
        </div>
        <div class="hidden sm:block text-gray-500">
            Press <kbd class="px-1.5 py-0.5 bg-navy-800 border border-navy-700 rounded text-gray-400">F</kbd> for Fullscreen
        </div>
    </footer>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- SLIDE DATA STRUCTURE (ALL 12 SECTIONS COMPREHENSIVELY PRESERVED) ---
        const slidesData = [
            {
                id: 1,
                titleCH: "当工作结束，经验去了哪里？",
                titleEN: "When the Work Ends, Where Does the Knowledge Go?",
                subtitleCH: "工作会结束，知识不应该随之消失。",
                subtitleEN: "Work may end, but knowledge should not disappear with it.",
                timing: "45 秒",
                type: "opening",
                bullets: [
                    { ch: "村庄故事：老木匠的材料经验、修桥者的未竟问题无法有效继承", en: "Village Story: Experienced carpenter's material wisdom and bridge repair logs lost without proper inheritance" },
                    { ch: "人员流动与接手者：后续接手者只能被迫从零开始探索", en: "Personnel turnover: Successors forced to restart from scratch repeatedly" },
                    { ch: "AI Agent 的平行挑战：单次对话聪明，但缺乏跨会话的工作连续性", en: "AI Agent Parallel: Single session intelligence vs. lack of cross-session work continuity" }
                ],
                cues: [
                    { type: "speech", text: "开场先看向听众，停顿两秒。语速放慢，不要一上来就讲技术名词。" }
                ],
                script: [
                    { zh: "大家好，今天我想从一个很简单的问题开始。当一项工作结束之后，我们究竟留下了什么？", en: "Hello everyone. Today, I would like to start with a simple question. When a piece of work ends, what do we actually leave behind?" },
                    { zh: "想象一个村庄。村里的老木匠知道哪种木料容易开裂，负责修桥的人知道上次维修留下了什么问题。这些知识来自长期实践，对整个村庄都很重要。", en: "Imagine a village. The experienced carpenter knows which types of wood are likely to crack. The person responsible for repairing the bridge knows what problems were left unresolved last time. This knowledge comes from years of practice, and it matters to the entire community." },
                    { zh: "但如果他们离开了，下一位接手者可能只能从头开始。", en: "But when they leave, the next person may have to start from scratch." },
                    { zh: "这让我想到 AI Agent 面临的一个相似问题。一次对话可以很聪明，但如果重要的决定和工作进度没有被保留下来，下一次工作就可能失去连续性。", en: "This brings me to a similar challenge in AI agents. A single conversation can be intelligent, but without preserving important decisions and progress, the next session may lose continuity." }
                ],
                nextCue: "停顿半秒，切到村庄的问题清单。"
            },
            {
                id: 2,
                titleCH: "信息断层的代价",
                titleEN: "The Cost of Lost Context",
                timing: "45 秒",
                type: "grid",
                gridItems: [
                    { icon: "fa-brain", titleCH: "决策丢失", titleEN: "Lost decisions", descCH: "遗忘先前的约束与定论", descEN: "Forgetting prior bounds & findings" },
                    { icon: "fa-rotate-right", titleCH: "重复劳动", titleEN: "Repeated work", descCH: "重复排除已解决的问题", descEN: "Re-checking resolved issues" },
                    { icon: "fa-link-slash", titleCH: "交接断层", titleEN: "Broken handoffs", descCH: "每次交接需重讲背景", descEN: "Re-explaining full context each time" },
                    { icon: "fa-triangle-exclamation", titleCH: "错误重现", titleEN: "Repeated mistakes", descCH: "踩中已知且犯过的坑", descEN: "Falling into previously known traps" }
                ],
                cues: [
                    { type: "speech", text: "用村庄案例继续推进。不要逐条机械念屏幕上的文字。" }
                ],
                script: [
                    { zh: "村庄真正的问题，并不只是某个人忘记了一件事。更大的问题在于，整个团队无法稳定地继承已经积累的知识。", en: "The real problem in the village is not simply that one person forgets something. The bigger issue is that the community cannot reliably inherit the knowledge it has already accumulated." },
                    { zh: "比如，维修人员可能重复检查已经排除的问题，新来的木匠可能再次使用不合适的材料，而每一次交接都需要重新解释背景。", en: "For example, a repair worker may repeat checks that have already been completed, a new carpenter may use unsuitable materials again, and every handoff may require the background to be explained all over again." },
                    { zh: "这些损失会随着协作次数增加而累积。在软件开发中，我们也会遇到类似情况，尤其是项目持续数周甚至数月、任务在不同人员或不同 AI Agent 之间流转的时候。", en: "These losses accumulate as collaboration continues. We encounter the same pattern in software development, especially when projects last for weeks or months and tasks move between different people or AI agents." },
                    { zh: "所以，问题的关键是怎样让重要信息在工作过程中被保存，在需要的时候能够被找到，并且在交接时仍然可信。", en: "The key question is how to preserve important information during work, retrieve it when needed, and keep it trustworthy when responsibility changes hands." }
                ]
            },
            {
                id: 3,
                titleCH: "为什么 AI Agent 也会遗忘？",
                titleEN: "Why Do AI Agents Lose Context?",
                timing: "50 秒",
                type: "comparison",
                quoteCH: "对话记录不等于可用的工作上下文。",
                quoteEN: "A conversation transcript is not the same as usable work context.",
                bullets: [
                    { ch: "会话边界 (Session Boundary)：单次会话结束后背景上下文即重置", en: "Session Boundaries: Context resets completely upon conversation completion" },
                    { ch: "上下文窗口限制 (Context Window Limit)：全量历史成本高且容易引发噪声干扰", en: "Context Window Limits: Re-feeding raw transcript is noisy, costly, and ineffective" },
                    { ch: "信息过载与筛选困难：原始对话混杂了过时的中间思考与临时废稿", en: "Information Overload: Raw history contains obsolete temporary thoughts and noise" }
                ],
                cues: [
                    { type: "speech", text: "这一页从生活案例转入技术。强调“信息保存”和“信息使用”之间的区别。" }
                ],
                script: [
                    { zh: "AI Agent 的工作方式让这个问题更加明显。Agent 可以在一次会话里理解需求、分析代码、作出决定并执行任务，但会话结束之后，下一次会话未必能够直接获得所有必要的背景。", en: "This challenge becomes more visible with AI agents. An agent can understand requirements, analyze code, make decisions, and execute tasks within one session. After the session ends, however, the next session may not have all the context it needs." },
                    { zh: "即使历史记录还在，直接把整段历史重新交给模型也未必是最好的方案。历史可能很长，其中有些信息已经过时，有些与当前任务无关，还有些只是当时的临时讨论。", en: "Even when the transcript still exists, sending the entire history back to the model is not necessarily the best solution. The history may be long, some information may be outdated, some may be irrelevant, and some may reflect only temporary discussion." },
                    { zh: "因此，我们需要把原始信息、经过确认的知识、当前任务状态，以及可重复使用的做法组织起来，再根据当前任务选择真正有用的部分。", en: "What we need is a way to organize raw evidence, established knowledge, current task state, and reusable procedures, then select the parts that are actually useful for the task at hand." }
                ]
            },
            {
                id: 4,
                titleCH: "PowerContext 是什么？",
                titleEN: "What Is PowerContext?",
                timing: "50 秒",
                type: "architecture",
                subtitleCH: "OceanBase 开源的 AI Agent 上下文基础设施",
                subtitleEN: "Open-source context infrastructure for AI agents",
                archSteps: [
                    { step: "Input", ch: "AI Agent / 人类协作", en: "Work in progress" },
                    { step: "Core", ch: "PowerContext 服务", desc: "Capture · Organize · Retrieve · Hand off\n记录 · 组织 · 检索 · 交接", highlight: true },
                    { step: "Output", ch: "后续会话 / Agent / 团队成员", en: "Next session / Agent / Teammate" }
                ],
                cues: [
                    { type: "speech", text: "可以指向架构图，说明 PowerContext 位于 Agent 的工作过程与持久化上下文之间。" }
                ],
                script: [
                    { zh: "PowerContext 是 OceanBase 开源的 AI Agent 上下文服务。它的目标是让有价值的工作上下文脱离单一对话，能够在不同会话、不同 Agent 和人与 Agent 的交接中继续发挥作用。", en: "PowerContext is an open-source context service for AI agents developed under OceanBase. Its goal is to keep valuable work context outside any single conversation, so it can remain useful across sessions, agents, and handoffs between people and agents." },
                    { zh: "它保存的不只是传统意义上的记忆，还包括工作中的决策、约束、证据、进度，以及经过整理、可以再次使用的经验。", en: "It preserves more than memory in the traditional sense. It also organizes decisions, constraints, evidence, progress, and experience that can be reused in future work." },
                    { zh: "从产品角度看，它试图解决的是工作连续性。从工程角度看，它提供了可追溯、可管理的上下文资产，以及供不同 Agent 和应用使用的接口。", en: "From a product perspective, it addresses work continuity. From an engineering perspective, it provides traceable, manageable context artifacts and interfaces that different agents and applications can use." },
                    { zh: "这也是我认为这个项目值得研究的原因。随着 Agent 承担越来越长的任务，管理上下文会成为系统设计的重要组成部分。", en: "That is why I believe this project is worth studying. As agents take on longer-running tasks, context management becomes an important part of system design." }
                ]
            },
            {

                timing: "60 秒",

                    { title: "Experience", sub: "经过审查的经验", ch: "记录情境、采取的行动、结果与可复用教训。", en: "Situations, actions, outcomes, and reusable lessons." },
                    { title: "Skill", sub: "可复用的程序", ch: "把经过审查的操作步骤和验证要求整理成技能。", en: "Reviewed procedures and validation checks." }
                ],
                cues: [
                    { type: "speech", text: "按四个模块依次讲解。每个概念只解释它解决的问题，不要深入 API 细节。" }
                ],
                script: [
                    { zh: "PowerContext 的核心概念可以用四个部分来理解。", en: "PowerContext can be understood through four core concepts." },

                                    <div class="bg-navy-800 p-4 rounded-xl border border-navy-700 hover:border-accent-cyan transition-all">
                                        <div class="flex items-center space-x-3 mb-2">
                                            <div class="p-2 rounded-lg bg-navy-900 text-accent-cyan"><i class="fa-solid ${item.icon}"></i></div>
                                            <div>
                                                <h3 class="font-bold text-white text-base">${item.titleCH}</h3>
                                                <p class="text-xs text-accent-teal">${item.titleEN}</p>
                                            </div>
                                        </div>
                                        <p class="text-xs text-gray-300">${item.descCH}</p>
                                        <p class="text-xs text-gray-400">${item.descEN}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'comparison':
                    html = `
                        <div class="space-y-6">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="p-4 bg-navy-800 rounded-xl border-l-4 border-amber-500 my-4">
                                <p class="text-base font-semibold text-amber-300">"${slide.quoteCH}"</p>
                                <p class="text-xs text-amber-200/70 font-mono">"${slide.quoteEN}"</p>
                            </div>
                            <div class="space-y-3">
                                ${slide.bullets.map(b => `
                                    <div class="p-3 bg-navy-800/60 rounded-lg border border-navy-700">
                                        <p class="text-sm font-medium text-white">${b.ch}</p>
                                        <p class="text-xs text-gray-400">${b.en}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'architecture':
                    html = `
                        <div class="space-y-6">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="p-4 bg-navy-800 rounded-xl border border-accent-cyan/30 flex flex-col space-y-3">
                                ${slide.archSteps.map((s, idx) => `
                                    <div class="flex items-center space-x-3 p-3 rounded-lg ${s.highlight ? 'bg-accent-cyan/20 border border-accent-cyan' : 'bg-navy-900 border border-navy-700'}">
                                        <span class="font-mono text-xs text-accent-teal font-bold">${s.step}</span>
                                        <div class="flex-1">
                                            <p class="text-sm font-bold text-white">${s.ch}</p>
                                            <p class="text-xs text-gray-300 whitespace-pre-line">${s.desc || s.en}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'four-cards':
                    html = `
                        <div class="space-y-4">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${slide.cards.map(c => `
                                    <div class="p-3.5 bg-navy-800 rounded-xl border border-navy-700 flex flex-col justify-between">
                                        <div>
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-bold text-accent-cyan text-base font-mono">${c.title}</span>
                                                <span class="text-xs text-gray-400 bg-navy-900 px-2 py-0.5 rounded">${c.sub}</span>
                                            </div>
                                            <p class="text-xs text-gray-200 mt-1">${c.ch}</p>
                                        </div>
                                        <p class="text-xs text-gray-400 font-mono mt-2 pt-2 border-t border-navy-700/50">${c.en}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'flow':
                    html = `
                        <div class="space-y-4">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-2">
                                ${slide.flowSteps.map(step => `
                                    <div class="p-2.5 bg-navy-800 rounded-lg border border-navy-700 text-center">
                                        <span class="text-xs font-mono text-accent-cyan font-bold block">${step.num}</span>
                                        <span class="text-xs font-bold text-white block my-1">${step.name}</span>
                                        <span class="text-[10px] text-gray-300 block">${step.descCH}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="space-y-2 pt-2">
                                ${slide.bullets.map(b => `
                                    <div class="p-2 bg-navy-900/80 rounded border border-navy-800 text-xs">
                                        <span class="text-white font-medium">${b.ch}</span>
                                        <span class="text-gray-400 block">${b.en}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'engineering':
                    html = `
                        <div class="space-y-4">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="space-y-3">
                                ${slide.focusPoints.map(p => `
                                    <div class="p-3 bg-navy-800 rounded-xl border-l-4 border-accent-cyan border-y border-r border-navy-700">
                                        <h3 class="font-bold text-accent-teal text-sm mb-1">${p.title}</h3>
                                        <p class="text-xs text-gray-200">${p.detailCH}</p>
                                        <p class="text-xs text-gray-400 mt-0.5">${p.detailEN}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'values':
                    html = `
                        <div class="space-y-4">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                ${slide.values.map(v => `
                                    <div class="p-3 bg-navy-800 rounded-xl border border-navy-700 text-center">
                                        <span class="text-accent-teal font-bold text-sm block">${v.labelCH}</span>
                                        <span class="text-xs font-mono text-gray-400 block mb-2">${v.labelEN}</span>
                                        <span class="text-xs text-gray-300 block">${v.descCH}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="p-3 bg-red-950/40 rounded-xl border border-red-800/50 text-xs text-red-200">
                                <p class="font-semibold">${slide.quoteCH}</p>
                                <p class="text-red-300/70 font-mono mt-1">${slide.quoteEN}</p>
                            </div>
                        </div>
                    `;
                    break;

                case 'conclusion':
                    html = `
                        <div class="space-y-6 text-center lg:text-left">
                            <div>
                                <h1 class="text-3xl font-bold text-white">${slide.titleCH}</h1>
                                <h2 class="text-xl text-accent-teal font-light mt-1">${slide.titleEN}</h2>
                            </div>
                            <div class="space-y-3">
                                ${slide.summaryBullets.map(b => `
                                    <div class="p-3 bg-navy-800 rounded-xl border border-navy-700">
                                        <p class="text-sm font-bold text-white">${b.ch}</p>
                                        <p class="text-xs text-gray-400 mt-0.5">${b.en}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'backup':
                    html = `
                        <div class="space-y-4">
                            <div>
                                <span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-mono px-2 py-0.5 rounded">BACKUP SLIDE</span>
                                <h1 class="text-2xl font-bold text-white mt-1">${slide.titleCH}</h1>
                            </div>
                            <div class="grid grid-cols-1 gap-2">
                                ${slide.backupSections.map(s => `
                                    <div class="p-2.5 bg-navy-800 rounded-lg border border-navy-700">
                                        <span class="text-xs font-bold text-accent-cyan block">${s.title}</span>
                                        <span class="text-xs font-mono text-gray-300 block">${s.content}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                default:
                    html = `
                        <div class="space-y-4">
                            <h1 class="text-2xl font-bold text-white">${slide.titleCH}</h1>
                            <h2 class="text-lg text-accent-light">${slide.titleEN}</h2>
                            <ul class="space-y-2">
                                ${slide.bullets ? slide.bullets.map(b => `<li class="text-sm text-gray-300">• ${b.ch}</li>`).join('') : ''}
                            </ul>
                        </div>
                    `;
            }

            container.innerHTML = html;

            // Render Right Side (Speaker Script & Cues)
            renderSpeakerNotes(slide);
        }

        // --- RENDER SPEAKER NOTES (RIGHT PANEL) ---
        function renderSpeakerNotes(slide) {
            const container = document.getElementById('speaker-notes-area');
            container.style.fontSize = `${fontSize}px`;
            
            let html = '';

            // Cues Section
            if (slide.cues && slide.cues.length > 0) {
                html += `<div class="mb-4 space-y-2">`;
                slide.cues.forEach(cue => {
                    html += `
                        <div class="p-2.5 rounded bg-navy-900 border border-navy-700 text-xs flex items-start space-x-2">
                            <span class="cue-tag cue-${cue.type}">[${cue.type}]</span>
                            <span class="text-amber-300 font-medium">${cue.text}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // Verbatim Script Dual Language
            html += `<div class="space-y-4">`;
            slide.script.forEach((pair, i) => {
                const showZH = langFilter === 'all' || langFilter === 'zh';
                const showEN = langFilter === 'all' || langFilter === 'en';

                html += `
                    <div class="p-3 rounded-lg bg-navy-900/60 border border-navy-700/60 space-y-1.5">
                        <div class="text-xs font-mono text-gray-500">Paragraph ${i+1}</div>
                        ${showZH ? `<p class="text-white font-medium leading-relaxed">${pair.zh}</p>` : ''}
                        ${showEN ? `<p class="text-accent-teal/80 text-xs font-sans leading-relaxed">${pair.en}</p>` : ''}
                    </div>
                `;
            });
            html += `</div>`;

            if (slide.nextCue) {
                html += `
                    <div class="mt-4 p-2 bg-blue-950/40 border border-blue-800 rounded text-xs text-blue-300 flex items-center space-x-2">
                        <span class="cue-tag cue-slide">[NEXT]</span>
                        <span>${slide.nextCue}</span>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // --- CONTINUOUS TELEPROMPTER GENERATION ---
        function generateTeleprompterContent() {
            const container = document.getElementById('teleprompter-content');
            container.innerHTML = '';

            slidesData.forEach((slide, idx) => {
                const section = document.createElement('div');
                section.id = `tele-slide-${idx}`;
                section.className = `p-6 rounded-2xl border border-navy-700 bg-navy-800/50 transition-all duration-300 hover:border-accent-cyan space-y-4`;
                
                let cuesHTML = slide.cues ? slide.cues.map(c => `<span class="cue-tag cue-${c.type}">[${c.type}: ${c.text}]</span>`).join(' ') : '';
                
                let scriptHTML = slide.script.map(pair => `
                    <div class="my-3 space-y-1">
                        <p class="text-white text-lg font-medium leading-relaxed">${pair.zh}</p>
                        <p class="text-accent-teal/80 text-sm font-sans leading-relaxed">${pair.en}</p>
                    </div>
                `).join('');

                let qaHTML = '';
                if (slide.qaList) {
                    qaHTML = `<div class="mt-4 space-y-3 pt-4 border-t border-navy-700">` + slide.qaList.map(qa => `
                        <div class="p-3 bg-navy-900 rounded-lg text-sm">
                            <p class="font-bold text-accent-cyan">${qa.qCH}</p>
                            <p class="text-xs text-accent-teal/70">${qa.qEN}</p>
                            <p class="text-white mt-1">${qa.aCH}</p>
                            <p class="text-xs text-gray-400">${qa.aEN}</p>
                        </div>
                    `).join('') + `</div>`;
                }

                section.innerHTML = `
                    <div class="flex justify-between items-center border-b border-navy-700 pb-3">
                        <div class="flex items-center space-x-3">
                            <span class="font-mono text-xs px-2 py-1 rounded bg-accent-cyan text-navy-900 font-bold">SLIDE ${String(slide.id).padStart(2, '0')}</span>
                            <h2 class="text-xl font-bold text-white">${slide.titleCH} / <span class="text-accent-light text-base font-normal">${slide.titleEN}</span></h2>
                        </div>
                        <span class="text-xs font-mono text-gray-400"><i class="fa-regular fa-clock mr-1"></i>${slide.timing}</span>
                    </div>
                    ${cuesHTML ? `<div class="my-2">${cuesHTML}</div>` : ''}
                    <div class="tele-script-body">${scriptHTML}</div>
                    ${qaHTML}
                    ${slide.nextCue ? `<div class="p-2 bg-blue-950/40 rounded border border-blue-800 text-xs text-blue-300">[FLIP CUE]: ${slide.nextCue}</div>` : ''}
                `;

                container.appendChild(section);
            });
        }

        function highlightTeleprompterSection(index) {
            slidesData.forEach((_, idx) => {
                const el = document.getElementById(`tele-slide-${idx}`);
                if (el) el.classList.remove('active-tele-section');
            });
            const target = document.getElementById(`tele-slide-${index}`);
            if (target) {
                target.classList.add('active-tele-section');
                if (document.getElementById('view-teleprompter').classList.contains('hidden') === false) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // --- VIEW SWITCHING ---
        function switchView(mode) {
            const slidesView = document.getElementById('view-slides');
            const teleView = document.getElementById('view-teleprompter');
            const btnSlides = document.getElementById('btn-mode-slides');
            const btnTele = document.getElementById('btn-mode-tele');
            const teleControls = document.getElementById('tele-controls');

            if (mode === 'slides') {
                slidesView.classList.remove('hidden');
                teleView.classList.add('hidden');
                btnSlides.className = "px-3 py-1 text-xs font-medium rounded-md transition-all bg-accent-cyan text-navy-900 font-semibold shadow";
                btnTele.className = "px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
                teleControls.classList.add('hidden');
                stopTeleprompterScroll();
            } else {
                slidesView.classList.add('hidden');
                teleView.classList.remove('hidden');
                btnTele.className = "px-3 py-1 text-xs font-medium rounded-md transition-all bg-accent-cyan text-navy-900 font-semibold shadow";
                btnSlides.className = "px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
                teleControls.classList.remove('hidden');
                highlightTeleprompterSection(currentSlideIndex);
            }
        }

        // --- FONT SIZE CONTROLS ---
        function adjustFontSize(delta) {
            fontSize = Math.max(12, Math.min(28, fontSize + delta));
            document.getElementById('font-size-label').innerText = `${fontSize}px`;
            
            // Apply font size to speaker notes and teleprompter
            document.getElementById('speaker-notes-area').style.fontSize = `${fontSize}px`;
            const teleContainer = document.getElementById('teleprompter-content');
            if (teleContainer) {
                teleContainer.style.fontSize = `${fontSize}px`;
            }
        }

        // --- LANGUAGE FILTER ---
        function toggleLanguageFilter(lang) {
            langFilter = lang;
            ['all', 'zh', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-btn-${l}`);
                if (l === lang) {
                    btn.className = "px-2 py-0.5 rounded bg-accent-cyan text-navy-900 font-semibold";
                } else {
                    btn.className = "px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white";
                }
            });
            renderSpeakerNotes(slidesData[currentSlideIndex]);
        }

        // --- TELEPROMPTER AUTO-SCROLL ---
        function toggleTeleprompterScroll() {
            if (isTeleScrolling) {
                stopTeleprompterScroll();
            } else {
                startTeleprompterScroll();
            }
        }

        function startTeleprompterScroll() {
            isTeleScrolling = true;
            document.getElementById('tele-play-icon').className = "fa-solid fa-pause";
            const container = document.getElementById('view-teleprompter');
            
            teleScrollInterval = setInterval(() => {
                container.scrollTop += scrollSpeed * 0.5;
            }, 30);
        }

        function stopTeleprompterScroll() {
            isTeleScrolling = false;
            document.getElementById('tele-play-icon').className = "fa-solid fa-play";
            if (teleScrollInterval) clearInterval(teleScrollInterval);
        }

        function updateScrollSpeed(val) {
            scrollSpeed = parseInt(val);
            document.getElementById('speed-label').innerText = `${scrollSpeed}x`;
        }

        // --- STOPWATCH / TIMER ---
        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timer-icon').className = "fa-solid fa-play";
            } else {
                isTimerRunning = true;
                document.getElementById('timer-icon').className = "fa-solid fa-pause";
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                    const secs = String(timerSeconds % 60).padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${mins}:${secs}`;
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 0;
            document.getElementById('timer-display').innerText = "00:00";
            document.getElementById('timer-icon').className = "fa-solid fa-play";
        }

        // --- FULLSCREEN ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- KEYBOARD SHORTCUTS ---
        function setupKeyboardListeners() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevSlide();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (!document.getElementById('view-teleprompter').classList.contains('hidden')) {
                        toggleTeleprompterScroll();
                    } else {
                        toggleTimer();
                    }
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullscreen();
                }
            });
        }
    </script>
</body>
</html>
