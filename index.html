<html lang="zh-CN" class="h-full">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerContext Roadshow Presentation & Teleprompter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

                            cyan: '#00B4D8',
                            teal: '#48CAE4',
                            light: '#90E0EF'

                            200: '#E9ECEF'

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B132B;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A3A5E;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00B4D8;
        }

        /* Pulse highlight for current slide in teleprompter */
        .active-tele-section {
            border-left: 4px solid #00B4D8;
            background-color: rgba(28, 37, 65, 0.4);
        }

        /* Cue badge highlights */
        .cue-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 4px;
            text-transform: uppercase;
        }
        .cue-speech { background-color: rgba(245, 158, 11, 0.2); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .cue-slide { background-color: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.4); }
        .cue-pause { background-color: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .cue-time { background-color: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.4); }

        /* Smooth animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-navy-900 text-warm-100 font-sans h-full flex flex-col overflow-hidden select-none">

    <!-- TOP CONTROL BAR -->

        <!-- Left: Branding & View Mode Toggle -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-accent-teal text-xl"></i>
                <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-accent-teal bg-clip-text text-transparent">PowerContext</span>
                <span class="text-xs bg-navy-700 text-accent-light px-2 py-0.5 rounded border border-navy-600 font-mono">Roadshow</span>
            </div>
            
            <div class="h-5 w-px bg-navy-600 hidden sm:block"></div>

            <!-- Mode Switcher -->
            <div class="flex bg-navy-900 rounded-lg p-1 border border-navy-700">
                <button id="btn-mode-slides" onclick="switchView('slides')" class="px-3 py-1 text-xs font-medium rounded-md transition-all bg-accent-cyan text-navy-900 font-semibold shadow">
                    <i class="fa-solid fa-desktop mr-1.5"></i>Slide View
                </button>
                <button id="btn-mode-tele" onclick="switchView('teleprompter')" class="px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-scroll mr-1.5"></i>Teleprompter
                </button>
            </div>

            <!-- Toggle Side Notes / Teleprompter Panel (Default OFF) -->
            <button id="btn-toggle-notes" onclick="toggleSideNotes()" class="bg-accent-cyan text-navy-900 font-semibold text-xs px-2.5 py-1.5 rounded-lg border border-accent-cyan transition flex items-center space-x-1.5" title="Show/Hide Teleprompter Script Panel">
                <i class="fa-solid fa-columns"></i>
                <span id="notes-toggle-text">显示提词</span>
            </button>
        </div>

        <!-- Center: Slide Navigation Quick Access -->
        <div class="flex items-center space-x-2">
            <button onclick="prevSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Previous Slide (Left Arrow)">
                <i class="fa-solid fa-chevron-left w-4 h-4 flex items-center justify-center"></i>
            </button>
            <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="bg-navy-900 text-accent-teal text-xs font-medium rounded-lg px-2.5 py-1.5 border border-navy-700 focus:outline-none focus:border-accent-cyan cursor-pointer">
                <!-- Populated via JS -->
            </select>
            <button onclick="nextSlide()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-accent-light transition" title="Next Slide (Right Arrow)">
                <i class="fa-solid fa-chevron-right w-4 h-4 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Right: Teleprompter Controls & Timer -->
        <div class="flex items-center space-x-3">
            <!-- Timer & Stopwatch -->
            <div class="flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-3 py-1 font-mono text-xs">
                <i class="fa-regular fa-clock text-accent-teal"></i>
                <span id="timer-display" class="text-white font-medium">00:00</span>
                <button id="btn-timer-toggle" onclick="toggleTimer()" class="text-gray-400 hover:text-accent-teal ml-1">
                    <i class="fa-solid fa-play" id="timer-icon"></i>
                </button>
                <button onclick="resetTimer()" class="text-gray-400 hover:text-red-400 ml-0.5">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Font Size Control -->
            <div class="hidden md:flex items-center space-x-1 bg-navy-900 border border-navy-700 rounded-lg p-1">
                <button onclick="adjustFontSize(-1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Decrease Font Size">A-</button>
                <span id="font-size-label" class="text-xs text-accent-teal font-mono px-1">16px</span>
                <button onclick="adjustFontSize(1)" class="p-1 px-2 text-xs text-gray-300 hover:text-white" title="Increase Font Size">A+</button>
            </div>

            <!-- Auto-Scroll Speed (Teleprompter Mode) -->
            <div id="tele-controls" class="hidden flex items-center space-x-2 bg-navy-900 border border-navy-700 rounded-lg px-2 py-1">
                <button id="btn-tele-play" onclick="toggleTeleprompterScroll()" class="text-accent-cyan hover:text-accent-teal p-1">
                    <i class="fa-solid fa-play" id="tele-play-icon"></i>
                </button>
                <span class="text-xs text-gray-400 font-mono">Speed:</span>
                <input type="range" id="scroll-speed" min="1" max="10" value="3" onchange="updateScrollSpeed(this.value)" class="w-16 accent-accent-cyan cursor-pointer">
                <span id="speed-label" class="text-xs font-mono text-accent-teal">3x</span>
            </div>

            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullscreen()" class="p-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-gray-300 hover:text-white transition" title="Toggle Fullscreen">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 relative overflow-hidden flex">

        <!-- VIEW 1: DUAL SLIDE & NOTES PRESENTATION VIEW -->
        <div id="view-slides" class="w-full h-full flex flex-col lg:flex-row overflow-hidden">
            <!-- Left Side: Projected Slide Deck Canvas -->

                </div>

                <!-- Slide Center Content -->
                <div id="slide-content-area" class="my-auto fade-in">
                    <!-- Dynamic Slide HTML inserted here -->
                </div>

                <!-- Slide Footer Info -->
                <div class="mt-4 pt-3 border-t border-navy-800 flex justify-between items-center text-xs text-gray-500 font-mono">
                    <span>OceanBase AI Agent Context Infrastructure</span>
                    <span>PowerContext Roadshow</span>
                </div>
            </div>

            <!-- Right Side: Verbatim Script, Speaker Cues & Notes (Hidden by default) -->
            <div id="speaker-notes-container" class="w-full lg:w-5/12 h-full bg-navy-800/90 flex-col overflow-hidden transition-all duration-300 hidden" style="display: none;">

                    </div>
                    <div class="flex space-x-1 text-xs">
                        <button onclick="toggleLanguageFilter('all')" id="lang-btn-all" class="px-2 py-0.5 rounded bg-accent-cyan text-navy-900 font-semibold">ALL</button>
                        <button onclick="toggleLanguageFilter('zh')" id="lang-btn-zh" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">中文</button>
                        <button onclick="toggleLanguageFilter('en')" id="lang-btn-en" class="px-2 py-0.5 rounded bg-navy-700 text-gray-300 hover:text-white">EN</button>
                    </div>
                </div>

                <div id="speaker-notes-area" class="flex-1 p-6 overflow-y-auto space-y-4 text-warm-100 leading-relaxed font-sans text-sm">
                    <!-- Dynamic Speaker Notes inserted here -->
                </div>
            </div>
        </div>

        <!-- VIEW 2: CONTINUOUS TELEPROMPTER VIEW -->
        <div id="view-teleprompter" class="w-full h-full hidden overflow-y-auto px-4 md:px-24 py-12 space-y-16 scroll-smooth bg-navy-900">
            <div class="max-w-4xl mx-auto space-y-16 pb-64" id="teleprompter-content">
                <!-- Dynamically generated continuous text for all slides -->
            </div>
        </div>

    </main>

        </div>
    </footer>

            renderSpeakerNotes(slidesData[currentSlideIndex]);
        }

        // --- RENDER CONTINUOUS TELEPROMPTER VIEW ---
        function renderTeleprompterView() {
            const container = document.getElementById('teleprompter-content');
            let html = '';

            slidesData.forEach((slide, idx) => {
                html += `
                    <div id="tele-slide-${idx}" class="p-6 rounded-xl bg-navy-800 border border-navy-700 space-y-4 transition-all">
                        <div class="flex justify-between items-center border-b border-navy-700 pb-3">
                            <span class="text-xs font-mono px-2.5 py-1 rounded bg-navy-900 text-accent-teal border border-navy-700">SLIDE ${String(idx + 1).padStart(2, '0')} / ${slidesData.length}</span>
                            <span class="text-sm font-bold text-white">${slide.titleCH}</span>
                        </div>
                        <div class="space-y-3">
                `;

                if (slide.cues) {
                    slide.cues.forEach(cue => {
                        html += `<div><span class="cue-tag cue-speech">提示</span><span class="text-xs text-accent-light italic">${cue.text}</span></div>`;
                    });
                }

                slide.script.forEach(s => {
                    html += `
                        <div class="space-y-1 p-3 rounded-lg bg-navy-900/60 border border-navy-700/50">
                            <p class="text-sm text-warm-100 font-medium">${s.zh}</p>
                            <p class="text-xs font-mono text-gray-400">${s.en}</p>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function highlightActiveTeleSection() {
            slidesData.forEach((_, idx) => {
                const el = document.getElementById(`tele-slide-${idx}`);
                if (!el) return;
                if (idx === currentSlideIndex) {
                    el.classList.add('active-tele-section');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    el.classList.remove('active-tele-section');
                }
            });
        }

        // --- TIMER & STOPWATCH ---
        function toggleTimer() {
            isTimerRunning = !isTimerRunning;
            const icon = document.getElementById('timer-icon');
            if (isTimerRunning) {
                icon.className = "fa-solid fa-pause";
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                }, 1000);
            } else {
                icon.className = "fa-solid fa-play";
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timer-icon').className = "fa-solid fa-play";
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // --- FONT SIZE ADJUSTMENT ---
        function adjustFontSize(delta) {
            fontSize = Math.min(Math.max(fontSize + delta, 12), 26);
            document.getElementById('font-size-label').textContent = `${fontSize}px`;
            const area = document.getElementById('slide-content-area');
            if (area) area.style.fontSize = `${fontSize}px`;
        }

        // --- TELEPROMPTER AUTO SCROLL ---
        function toggleTeleprompterScroll() {
            isTeleScrolling = !isTeleScrolling;
            const icon = document.getElementById('tele-play-icon');
            const viewTele = document.getElementById('view-teleprompter');

            if (isTeleScrolling) {
                icon.className = "fa-solid fa-pause text-red-400";
                teleScrollInterval = setInterval(() => {
                    viewTele.scrollTop += scrollSpeedMultiplier;
                }, 50);
            } else {
                icon.className = "fa-solid fa-play text-accent-cyan";
                clearInterval(teleScrollInterval);
            }
        }

        function updateScrollSpeed(val) {
            scrollSpeedMultiplier = parseInt(val);
            document.getElementById('speed-label').textContent = `${val}x`;
        }

        // --- FULLSCREEN ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- KEYBOARD SHORTCUTS ---
        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevSlide();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (currentView === 'teleprompter') {
                        toggleTeleprompterScroll();
                    } else {
                        toggleTimer();
                    }
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullscreen();
                }
            });
        }
    </script>
</body>
</html>
