
<script>
/* =========================================================
   口语通静态演示适配层
   适用：本地 file:// 和 GitHub Pages
   正式服务器环境不启用此补丁
   ========================================================= */
(function () {
  'use strict';

  const host = location.hostname.toLowerCase();
  const STATIC_DEMO =
    location.protocol === 'file:' ||
    host === 'github.io' ||
    host.endsWith('.github.io');

  if (!STATIC_DEMO) return;

  window.KY_STATIC_DEMO = true;
  window.KY_DEMO_LABEL = '演示模式 · AI 数据为模拟结果';

  /* 1. 页面顶部添加演示模式标识 */
  function addDemoNotice() {
    if (document.getElementById('ky-demo-notice')) return;

    const el = document.createElement('div');
    el.id = 'ky-demo-notice';
    el.textContent = window.KY_DEMO_LABEL;
    el.style.cssText = `
      position:fixed;
      z-index:99999;
      top:8px;
      left:50%;
      transform:translateX(-50%);
      max-width:calc(100vw - 24px);
      padding:7px 13px;
      border:1px solid #bfdbfe;
      border-radius:999px;
      background:rgba(239,246,255,.96);
      color:#1d4ed8;
      font:600 12px/1.4 system-ui,sans-serif;
      box-shadow:0 3px 12px rgba(15,23,42,.10);
      text-align:center;
      pointer-events:none;
      white-space:nowrap;
    `;
    document.body.appendChild(el);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addDemoNotice);
  } else {
    addDemoNotice();
  }

  /* 2. 模拟 AI 讲解数据 */
  function demoLesson() {
    return {
      scene: '咖啡店点单',
      insight: '这张图片可以用于练习在咖啡店点单。下面是适合初学者的常用表达。',
      points: [
        {
          word: 'Could I have a latte?',
          phonetic: '/kʊd aɪ hæv ə ˈlɑːteɪ/',
          meaning: '我可以要一杯拿铁吗？',
          example: 'Could I have a latte, please?',
          translation: '请给我一杯拿铁。',
          tip: 'Could I have… 是礼貌点单的常用句型。'
        },
        {
          word: 'For here or to go?',
          phonetic: '/fɔːr hɪr ɔːr tə ɡoʊ/',
          meaning: '在这里喝还是打包？',
          example: 'Is that for here or to go?',
          translation: '您是在这里喝还是带走？',
          tip: 'to go 表示外带。'
        },
        {
          word: 'Iced, please.',
          phonetic: '/aɪst pliːz/',
          meaning: '请做冰的。',
          example: 'Could I get it iced, please?',
          translation: '可以帮我做成冰的吗？',
          tip: 'iced 表示加冰的。'
        },
        {
          word: 'That’s all, thank you.',
          phonetic: '/ðæts ɔːl θæŋk juː/',
          meaning: '就这些，谢谢。',
          example: 'That’s all for now, thank you.',
          translation: '暂时就这些，谢谢。',
          tip: '结束点单时自然又礼貌。'
        }
      ],
      tips: [
        '先听完整句，再跟读关键词。',
        '把 please 放在请求句末尾，会显得更礼貌。'
      ]
    };
  }

  /* 3. 模拟聊天和训练 */
  function demoReply() {
    return {
      text: '当然可以。我们来模拟一个真实的日常对话。你可以说：“Could I have a latte, please?”（请给我一杯拿铁。）这句话很自然，也很礼貌。试着用目标语言再说一遍吧。',
      reply: '当然可以。我们来模拟一个真实的日常对话。你可以说：“Could I have a latte, please?”（请给我一杯拿铁。）这句话很自然，也很礼貌。试着用目标语言再说一遍吧。'
    };
  }

  /* 4. 替换 AI 请求函数 */
  if (typeof window.callArk === 'function') {
    window.callArk = async function (
      messages,
      kind,
      meta,
      maxTokens,
      useJson,
      thinkMode,
      onDelta,
      modelOverride
    ) {
      const isLesson =
        kind === 'explain' ||
        kind === 'lesson';

      const data = isLesson
        ? demoLesson()
        : demoReply();

      const content = isLesson
        ? JSON.stringify(data)
        : data.text;

      if (typeof onDelta === 'function') {
        const chunkSize = 28;

        for (let i = 0; i < content.length; i += chunkSize) {
          onDelta(content.slice(i, i + chunkSize));
          await new Promise(resolve => setTimeout(resolve, 12));
        }
      }

      return {
        content,
        tokens: 0,
        logId: 'demo-' + Date.now(),
        demo: true
      };
    };
  }

  /* 5. 模拟账号服务 */
  if (typeof window.acctApi === 'function') {
    window.acctApi = function (path, method, body, qs) {
      const p = String(path || '');

      const account = {
        id: 'demo-user',
        uid: 'demo-user',
        phone: body?.phone || '13800000000',
        nickname: '演示用户',
        name: '演示用户',
        role: 'user',
        grant: 0,
        balance: 0,
        plan: 'free',
        status: 'active'
      };

      const token = 'ky-demo-token';

      if (/\/acct\/(login|register|onekey)$/.test(p)) {
        try {
          localStorage.setItem(
            'kyt_demo_account',
            JSON.stringify({ token, account })
          );
        } catch (e) {}

        return Promise.resolve({
          ok: true,
          token,
          account,
          me: account,
          demo: true
        });
      }

      if (/\/acct\/me$/.test(p)) {
        let saved = null;

        try {
          saved = JSON.parse(
            localStorage.getItem('kyt_demo_account') || 'null'
          );
        } catch (e) {}

        return Promise.resolve(
          saved
            ? {
                ok: true,
                token,
                account: saved.account,
                me: saved.account,
                demo: true
              }
            : {
                ok: false,
                error: '当前为访客演示，请体验登录流程。',
                demo: true
              }
        );
      }

      if (/\/acct\/logout$/.test(p)) {
        try {
          localStorage.removeItem('kyt_demo_account');
        } catch (e) {}

        return Promise.resolve({ ok: true, demo: true });
      }

      if (/\/(friend|dm)\//.test(p)) {
        return Promise.resolve({
          ok: true,
          list: [],
          rows: [],
          friends: [],
          convs: [],
          messages: [],
          data: [],
          demo: true
        });
      }

      if (/\/admin\//.test(p)) {
        return Promise.resolve({
          ok: false,
          error: '演示模式不开放真实管理端写操作。',
          demo: true
        });
      }

      return Promise.resolve({
        ok: true,
        data: {},
        list: [],
        rows: [],
        demo: true
      });
    };
  }

  /* 6. 运营后台静态化 */
  if (typeof window.opsFetch === 'function') {
    window.opsFetch = function () {
      return Promise.resolve(null);
    };
  }

  if (typeof window.opsPost === 'function') {
    window.opsPost = function () {
      return Promise.reject(
        new Error('演示模式不开放运营后台写操作')
      );
    };
  }

  /* 7. 拦截后端 API 请求 */
  const nativeFetch = window.fetch.bind(window);

  window.fetch = function (input, init) {
    const url = typeof input === 'string'
      ? input
      : input?.url || '';

    let path = '';

    try {
      path = new URL(url, location.href).pathname;
    } catch (e) {
      path = String(url);
    }

    const isBackend =
      /\/(health|log|log\/dump|chat|tts|asr)$/.test(path) ||
      /^\/(acct|friend|dm|admin|api)\//.test(path);

    if (!isBackend) {
      return nativeFetch(input, init);
    }

    const jsonResponse = data =>
      new Response(JSON.stringify(data), {
        status: 200,
        headers: {
          'Content-Type': 'application/json'
        }
      });

    if (/\/health$/.test(path)) {
      return Promise.resolve(
        jsonResponse({
          ok: true,
          model: 'demo-mock',
          speech: {
            capabilities: {
              llm: 'demo-mock',
              asr: 'demo-mock',
              tts: 'browser-speechSynthesis',
              ttsVoiceCount: 0
            },
            version: 'static-demo'
          }
        })
      );
    }

    if (/\/(log|log\/dump)$/.test(path)) {
      return Promise.resolve(
        jsonResponse({ ok: true, data: [] })
      );
    }

    if (/\/tts$/.test(path)) {
      return Promise.resolve(
        jsonResponse({
          ok: true,
          audio: null,
          demo: true,
          message: '使用浏览器语音合成'
        })
      );
    }

    if (/\/asr$/.test(path)) {
      return Promise.resolve(
        jsonResponse({
          ok: true,
          text: 'Could I have a latte, please?',
          demo: true
        })
      );
    }

    if (/\/chat$/.test(path)) {
      return Promise.resolve(
        jsonResponse({
          ok: true,
          content: demoReply().text,
          demo: true
        })
      );
    }

    return Promise.resolve(
      jsonResponse({
        ok: true,
        data: {},
        list: [],
        rows: [],
        demo: true
      })
    );
  };

  /* 8. 浏览器原生语音朗读 */
  window.KY_DEMO_SPEAK = function (text, lang) {
    if (!('speechSynthesis' in window)) {
      return false;
    }

    try {
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(
        String(text || '')
      );

      const map = {
        en: 'en-US',
        ja: 'ja-JP',
        ko: 'ko-KR',
        ru: 'ru-RU',
        fr: 'fr-FR',
        es: 'es-ES',
        nl: 'nl-NL',
        pt: 'pt-PT',
        th: 'th-TH',
        id: 'id-ID',
        ms: 'ms-MY',
        vi: 'vi-VN',
        yu: 'zh-HK',
        sc: 'zh-CN'
      };

      utterance.lang = map[lang || 'en'] || 'en-US';
      utterance.rate = 0.9;

      speechSynthesis.speak(utterance);
      return true;
    } catch (e) {
      return false;
    }
  };

  console.info(
    '[口语通] 静态演示模式已启用，不连接本地或生产后端。'
  );

})();
</script>
