        totalNumEl.textContent = slidesData.length;

        function buildTOC() {
            sidebarToc.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const item = document.createElement('button');
                item.className = `w-full text-left p-2 rounded-lg transition flex items-center justify-between text-xs ${
                    index === currentSlideIndex 
                        ? 'bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30' 
                        : 'text-slate-300 hover:bg-slate-800'
                }`;
                item.innerHTML = `
                    <span class="truncate pr-2">${slide.id}. ${slide.section}</span>
                    <span class="text-[10px] opacity-60 font-mono">${slide.id}</span>
                `;
                item.onclick = () => {
                    goToSlide(index);
                    sidebar.classList.add('-translate-x-full');
                };
                sidebarToc.appendChild(item);
            });
        }

        function renderSlide(index) {
            const slide = slidesData[index];
            currentNumEl.textContent = slide.id;
            slideTitleIndicator.textContent = `${slide.id}. ${slide.title}`;

            // Render Slide HTML
            container.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 shrink-0">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 text-xs font-bold border border-amber-500/30">

                            ${slide.title}
                        </h2>
                    </div>
                    <span class="text-xs text-slate-400 font-mono hidden md:inline">SLIDE ${slide.id} / ${slidesData.length}</span>
                </div>
                <div class="flex-1 slide-scroll overflow-y-auto pr-1">
                    ${slide.content}
                </div>
            `;

            // Update button states
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === slidesData.length - 1;

            buildTOC();
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
            }
        }

        btnPrev.addEventListener('click', () => goToSlide(currentSlideIndex - 1));
        btnNext.addEventListener('click', () => goToSlide(currentSlideIndex + 1));

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                if (currentSlideIndex < slidesData.length - 1) {
                    goToSlide(currentSlideIndex + 1);
                }
            } else if (e.key === 'ArrowLeft') {
                if (currentSlideIndex > 0) {
                    goToSlide(currentSlideIndex - 1);
                }
            }
        });
