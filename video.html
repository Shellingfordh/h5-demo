                <span class="font-bold text-cyan-400">最终交付要求：</span>${slide.finalDeliverable.replace('竞品分析的最终交付：', '')}
              </div>
            </div>
          `;
        } else if (slide.id === 15) {
          // 实验与增长
          html = `
            <div class="space-y-3">
              <div class="border-b border-slate-800 pb-1">
                <span class="text-xs font-mono text-cyan-400">15 / 实验与增长</span>
                <h2 class="text-lg sm:text-xl font-bold text-white">${slide.title}</h2>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 text-xs">
                ${slide.experiments.map(exp => `
                  <div class="glass-card-light rounded-xl p-2.5 border border-slate-800 space-y-1">
                    <div class="font-bold text-cyan-300 text-[11px]">${exp.name}</div>
                    <p class="text-[10px] text-slate-300">${exp.hypothesis}</p>
                    <p class="text-[10px] text-amber-300">${exp.compare}</p>
                    <p class="text-[10px] text-emerald-300">${exp.metrics}</p>
                  </div>
                `).join('')}
              </div>

              <div class="bg-cyan-950/30 p-2 rounded-xl border border-cyan-500/30 text-xs font-mono text-cyan-200">
                ${slide.growthPath}
              </div>

              <div class="bg-slate-900/80 p-2 rounded border border-slate-800 text-xs text-slate-300">
                <span class="font-bold text-amber-400">共同观察指标：</span>${slide.commonMetrics.replace('需要共同观察的指标：', '')}
              </div>
            </div>
          `;
        } else if (slide.id === 16) {
          // 落地计划
          html = `
            <div class="space-y-3">
              <div class="border-b border-slate-800 pb-1">
                <span class="text-xs font-mono text-cyan-400">16 / 30天落地计划</span>
                <h2 class="text-lg sm:text-xl font-bold text-white">${slide.title}</h2>
              </div>

              <!-- 4周时间轴 -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${slide.weeks.map(w => `
                  <div class="glass-card-light rounded-xl p-3 border border-slate-800 flex flex-col justify-between">
                    <div>
                      <div class="font-bold text-cyan-400 text-xs mb-1.5">${w.week}</div>
                      <ul class="text-[11px] text-slate-300 space-y-1 mb-3">
                        ${w.tasks.map(t => `<li>• ${t}</li>`).join('')}
                      </ul>
                    </div>
                    <div class="pt-2 border-t border-slate-800 text-[10px] text-amber-300 font-mono">
                      ${w.deliverable}
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="bg-cyan-950/40 p-2.5 rounded-xl border border-cyan-500/30 text-xs text-cyan-200 font-bold">
                ${slide.target30Days}
              </div>
            </div>
          `;
        } else if (slide.id === 17) {
          // 结束页
          html = `
            <div class="h-full flex flex-col justify-between space-y-4 py-2">
              <div class="border-b border-cyan-500/30 pb-3">
                <span class="text-xs font-mono text-cyan-400">17 / 结束页</span>
                <h1 class="text-2xl sm:text-4xl font-black text-white">${slide.title.replace('结束页｜', '')}</h1>
                <p class="text-base text-slate-300 mt-1">${slide.sub}</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
                ${slide.audiences.map(a => `
                  <div class="glass-card-light rounded-xl p-3 border border-slate-800 space-y-1">
                    <div class="font-bold text-cyan-400 text-xs">${a.role}</div>
                    <p class="text-[11px] text-slate-200 leading-relaxed">${a.value}</p>
                  </div>
                `).join('')}
              </div>

              <div class="bg-slate-900/90 p-4 rounded-xl border border-cyan-500/30 space-y-2">
                <div class="font-bold text-cyan-400 text-sm">最终方向</div>
                <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${slide.finalDirection.replace('最终方向：', '')}</p>
              </div>
            </div>
          `;
        } else if (slide.id === 18) {
          // 附录页
          html = `
            <div class="space-y-3">
              <div class="border-b border-slate-800 pb-1">
                <span class="text-xs font-mono text-cyan-400">18 / 附录</span>
                <h2 class="text-lg sm:text-xl font-bold text-white">${slide.title}</h2>
                <p class="text-xs text-slate-400">${slide.desc}</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                ${slide.appendixItems.map(item => `
                  <div class="glass-card-light rounded-xl p-3 border border-slate-800 space-y-1">
                    <div class="font-bold text-amber-400 text-xs">${item.num}</div>
                    <p class="text-[11px] text-slate-300 leading-relaxed">${item.details}</p>
                  </div>
                `).join('')}
              </div>

              <div class="bg-slate-900/80 p-2 rounded border border-slate-800 text-xs text-slate-400">
                <span class="font-bold text-slate-300">[建议呈现]</span> ${slide.suggestedRender}
              </div>
            </div>
          `;
        }

        slideContentEl.innerHTML = html;
      }

      // 导航控制器
      function nextSlide() {
        if (currentSlideIndex < SLIDES_DATA.length - 1) {
          currentSlideIndex++;
          renderCurrentSlide();
        }
      }

      function prevSlide() {
        if (currentSlideIndex > 0) {
          currentSlideIndex--;
          renderCurrentSlide();
        }
      }

      function goToSlide(index) {
        if (index >= 0 && index < SLIDES_DATA.length) {
          currentSlideIndex = index;
          renderCurrentSlide();
        }
      }

      // 切换讲稿侧栏
      function toggleSpeakerNotes() {
        isSpeakerNotesOpen = !isSpeakerNotesOpen;
        if (isSpeakerNotesOpen) {
          speakerNotesDrawerEl.classList.remove('hidden');
        } else {
          speakerNotesDrawerEl.classList.add('hidden');
        }
      }

      // 切换视图模式 (16:9 vs 手机卷轴)
      function toggleViewMode() {
        isMobileView = !isMobileView;
        const mainContainer = document.getElementById('main-container');
        const deckWrapper = document.getElementById('deck-wrapper');
        const viewModeText = document.getElementById('view-mode-text');

        if (isMobileView) {
          deckWrapper.classList.remove('aspect-video', 'max-h-[900px]');
          deckWrapper.classList.add('h-full', 'max-w-md');
          viewModeText.textContent = '16:9 PPT 视图';
        } else {
          deckWrapper.classList.add('aspect-video', 'max-h-[900px]');
          deckWrapper.classList.remove('max-w-md');
          viewModeText.textContent = '手机卷轴视图';
        }
      }

      // 切换全屏
      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      // 键盘导航快捷键
      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          prevSlide();
        } else if (e.key === 'n' || e.key === 'N') {
          toggleSpeakerNotes();
        }
      });

      // 触控 Swiping 支持
      let touchStartX = 0;
      let touchEndX = 0;
      document.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, false);
      document.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, false);

      function handleSwipe() {
        if (touchEndX < touchStartX - 50) {
          nextSlide();
        }
        if (touchEndX > touchStartX + 50) {
          prevSlide();
        }
      }

      // 防复制与防盗用安全功能机制
      function initSecurityWatermark() {
        const canvas = document.getElementById('watermark-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          drawWatermark();
        }

        function drawWatermark() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.font = '13px sans-serif';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.rotate(-20 * Math.PI / 180);

          const text = "仅供面试展示，严禁复制/爬取/开源";
          for (let i = -canvas.height; i < canvas.width * 2; i += 280) {
            for (let j = -canvas.width; j < canvas.height * 2; j += 120) {
              ctx.fillText(text, i, j);
            }
          }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // MutationObserver DOM 防篡改保全
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (!document.getElementById('watermark-canvas')) {
              document.body.appendChild(canvas);
            }
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      function initSecurityHandlers() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', e => e.preventDefault());

        // 拦截 Ctrl+C, F12, Ctrl+S, Ctrl+U 等调试快捷键
        document.addEventListener('keydown', function(e) {
          if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode === 85) || // Ctrl+U
            (e.ctrlKey && e.keyCode === 83) || // Ctrl+S
            (e.ctrlKey && e.keyCode === 67) || // Ctrl+C
            (e.ctrlKey && e.keyCode === 80)    // Ctrl+P
          ) {
            e.preventDefault();
            return false;
          }
        });

        // Anti-Debugging Loop (死循环防调)
        setInterval(function() {
          const startTime = performance.now();
          debugger;
          const endTime = performance.now();
          if (endTime - startTime > 100) {
            console.warn("Security Alert: Developer Tools Detected.");
          }
        }, 1000);

        // Frame / Iframe 防盗链校验
        if (window.top !== window.self) {
          try {
            window.top.location = window.self.location;
          } catch (e) {
            // 被阻断时锁屏
            document.body.innerHTML = '<div style="color:white;text-align:center;padding:50px;">未经授权的嵌入调用已拦截。</div>';
          }
        }
      }
    </script>
</body>
